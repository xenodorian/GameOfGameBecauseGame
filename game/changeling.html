<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Changeling: Knight of a thousand faces</title>
<style>
:root {
  --bg: #111418;
  --ink: #e8e4d8;
  --accent: #d9a441;
  --panel: rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}

#fullscreen {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 6px 10px;
  font: 13px system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
}

#fsNote {
  position: fixed;
  top: 44px;
  right: 8px;
  z-index: 3;
  max-width: 260px;
  padding: 8px 10px;
  font-size: 13px;
  background: var(--panel);
  border-radius: 4px;
}

#fsNote[hidden] { display: none; }

#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 4;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
  background: var(--bg);
  font-size: 18px;
}

body.portrait #rotate { display: flex; }

#touch {
  display: none;
  position: fixed;
  inset: auto 0 0 0;
  z-index: 2;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 12px 12px;
  pointer-events: none;
}

body.touch #touch { display: flex; }

#touch .pad,
#touch .face {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  pointer-events: auto;
}

#touch .face { justify-content: flex-end; max-width: 60vw; }

#touch button {
  width: 52px;
  height: 52px;
  font: 14px system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 50%;
  touch-action: none;
}

#touch button.jump { width: 72px; border-radius: 26px; }

#touch button.held { background: var(--accent); color: #111; }

@media (max-width: 900px) and (orientation: landscape) {
  #touch button { width: 44px; height: 44px; }
  #touch button.jump { width: 60px; }
}

</style>
</head>
<body>
<canvas id="screen" width="480" height="270"></canvas>

<button id="fullscreen" type="button" aria-label="Toggle full screen">Full screen</button>
<div id="fsNote" hidden></div>

<div id="rotate">
  <p>Rotate your device to landscape to play.</p>
</div>

<div id="touch" aria-hidden="true">
  <div class="pad">
    <button data-action="left">&#9664;</button>
    <button data-action="right">&#9654;</button>
  </div>
  <div class="face">
    <button data-action="up" class="jump">Jump</button>
    <button data-action="ab1">A</button>
    <button data-action="ab2">S</button>
    <button data-action="ab3">Z</button>
    <button data-action="ab4">X</button>
    <button data-action="discardSelf">Q</button>
    <button data-action="discardCard">C</button>
  </div>
</div>

// ---- engine.js ----
// Fixed-timestep loop, letterboxed canvas scaling, and the scene switch.
const Engine = (() => {
  const W = 480;
  const H = 270;
  const STEP = 1 / 60;

  let canvas = null;
  let ctx = null;
  let scene = null;
  let last = 0;
  let acc = 0;

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
    document.body.classList.toggle("portrait", window.innerHeight > window.innerWidth);
  }

  function frame(t) {
    const dt = Math.min((t - last) / 1000, 0.25);
    last = t;
    // Portrait pauses the game. The overlay asks the player to rotate.
    const paused = document.body.classList.contains("portrait");
    if (!paused) {
      acc += dt;
      while (acc >= STEP) {
        Input.update();
        scene.update(STEP);
        acc -= STEP;
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    scene.draw(ctx);
    requestAnimationFrame(frame);
  }

  function setScene(next) {
    scene = next;
    if (scene.enter) scene.enter();
  }

  function start(firstScene) {
    canvas = document.getElementById("screen");
    ctx = canvas.getContext("2d");
    canvas.width = W;
    canvas.height = H;
    window.addEventListener("resize", resize);
    resize();
    setScene(firstScene);
    last = performance.now();
    requestAnimationFrame(frame);
  }

  return { W, H, STEP, start, setScene, resize, current: () => scene };
})();

// ---- sfx.js ----
// Sound effects made in code with the Web Audio API. Nothing is loaded from disk.
// If audio is unavailable, play() does nothing from then on.
const Sfx = {
  enabled: true,
  ctx: null,
  broken: false,

  // One oscillator note with a short attack and a fade-out.
  tone(type, f0, f1, start, dur, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, start);
    if (f1) osc.frequency.linearRampToValueAtTime(f1, start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  },

  play(name) {
    if (!this.enabled || this.broken) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
      }
      const t = this.ctx.currentTime;
      switch (name) {
        case "jump":
          this.tone("square", 440, 660, t, 0.1, 0.08);
          break;
        case "hit":
          this.tone("square", 220, null, t, 0.08, 0.1);
          break;
        case "pickup":
          this.tone("triangle", 660, null, t, 0.06, 0.1);
          this.tone("triangle", 880, null, t + 0.06, 0.06, 0.1);
          break;
        case "hurt":
          this.tone("sawtooth", 300, 80, t, 0.3, 0.1);
          break;
        case "ability":
          this.tone("triangle", 520, null, t, 0.05, 0.06);
          break;
        case "complete":
          [523, 659, 784, 1047].forEach((f, i) => this.tone("triangle", f, null, t + i * 0.1, 0.1, 0.1));
          break;
        case "boss":
          this.tone("sawtooth", 110, null, t, 0.4, 0.12);
          break;
        default:
          break;
      }
    } catch (e) {
      this.broken = true;
    }
  },
};

// ---- input.js ----
// Logical actions fed by keyboard, gamepad, and on-screen touch buttons.
// Scenes ask for actions by name and never read raw keys or buttons.
const Input = (() => {
  // Keyboard uses letter keys and arrows, matching the design doc.
  const KEYS = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down",
    KeyA: "ab1",
    KeyS: "ab2",
    KeyZ: "ab3",
    KeyX: "ab4",
    KeyQ: "discardSelf",
    KeyC: "discardCard",
    Enter: "start",
  };

  // Standard gamepad mapping. Ability order follows the design doc:
  // ab1 is X, ab2 is Y, ab3 is A, ab4 is B.
  const PAD = {
    0: "ab3",
    1: "ab4",
    2: "ab1",
    3: "ab2",
    9: "start",
    12: "up",
    13: "down",
    14: "left",
    15: "right",
  };

  const keyHeld = new Set();
  const touchHeld = new Set();
  // A press that starts and ends between two fixed steps still counts once.
  const latched = new Set();
  let padHeld = new Set();
  let cur = new Set();
  let prev = new Set();
  let edge = new Set();

  window.addEventListener("keydown", (e) => {
    const action = KEYS[e.code];
    if (!action) return;
    e.preventDefault();
    if (!e.repeat) latched.add(action);
    keyHeld.add(action);
  });

  window.addEventListener("keyup", (e) => {
    const action = KEYS[e.code];
    if (action) keyHeld.delete(action);
  });

  // Losing focus must not leave a key stuck down.
  window.addEventListener("blur", () => {
    keyHeld.clear();
    touchHeld.clear();
  });

  function readGamepads() {
    padHeld = new Set();
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const pad of pads) {
      if (!pad) continue;
      pad.buttons.forEach((b, i) => {
        if (PAD[i] && (b.pressed || b.value > 0.5)) padHeld.add(PAD[i]);
      });
      // Left stick works as a bonus on top of the d-pad.
      if (pad.axes[0] < -0.5) padHeld.add("left");
      if (pad.axes[0] > 0.5) padHeld.add("right");
    }
  }

  // Call once per fixed step, before the scene updates.
  function update() {
    readGamepads();
    prev = cur;
    cur = new Set([...keyHeld, ...touchHeld, ...padHeld]);
    edge = new Set([...latched].concat([...cur].filter((a) => !prev.has(a))));
    latched.clear();
  }

  function down(action) {
    return cur.has(action);
  }

  function pressed(action) {
    return edge.has(action);
  }

  function setTouch(action, on) {
    if (on) {
      touchHeld.add(action);
      latched.add(action);
    } else {
      touchHeld.delete(action);
    }
  }

  function bindTouchButtons() {
    const root = document.getElementById("touch");
    const buttons = root.querySelectorAll("button[data-action]");
    const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    if (isTouch) document.body.classList.add("touch");

    for (const btn of buttons) {
      const action = btn.dataset.action;
      const press = (e) => {
        e.preventDefault();
        setTouch(action, true);
        btn.classList.add("held");
      };
      const release = (e) => {
        e.preventDefault();
        setTouch(action, false);
        btn.classList.remove("held");
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", release);
    }
  }

  function bindFullscreen() {
    const btn = document.getElementById("fullscreen");
    const note = document.getElementById("fsNote");
    btn.addEventListener("click", () => {
      if (!document.fullscreenEnabled) {
        note.textContent =
          "Full screen is not available in this browser. On iPhone, use Share, then Add to Home Screen.";
        note.hidden = false;
        return;
      }
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  }

  bindTouchButtons();
  bindFullscreen();

  return { update, down, pressed, setTouch };
})();

// ---- world.js ----
// Tile map, tile legend, and axis-separated collision.
const TILE = 32;

// Colors per theme. "field" keeps the original outdoor look.
const THEMES = {
  field: { sky: "#7fb6e0", far: "#a8cde8", near: "#6f9fbf" },
  dungeon: { sky: "#17141f", far: "#2a2533", near: "#3a3242" },
};

// Legend:
//   #  solid brick wall
//   =  solid grass ground
//   _  one-way platform (solid only when landing from above)
//   T  tree (decor, no collision)
//   S  player spawn (drawn as empty)
//   g  goblin grunt spawn (drawn as empty)
//   m  mud revenant spawn (drawn as empty)
//   j  rat king spawn (drawn as empty)
//   a  archer spawn (drawn as empty)
//   W  warlord boss spawn (drawn as empty)
//   F  level exit flag (drawn as a pole and flag)
//   c  card pickup on the ground (random character card)
//   k  card pickup on the main route (not a secret)
//   p  power-up on the ground (draws a random card into hand or deck)
//   ^  spikes (not solid; touching them is deadly)
//   i  sign post (decor; shows its text while the player stands at it)
//   x  cracked wall (solid; broken by the knight's shield bash or charge)
//   .  empty air
const World = (() => {
  let index = 0;
  let tiles = [];
  let rows = 0;
  let cols = 0;
  let width = 0;
  let height = 0;
  let spawn = { x: 0, y: 0 };
  let exit = null;
  // The flag is drawn dimmed while a boss keeps it closed.
  let flagOpen = true;
  // Temporary one-way platforms made in play (arrow anchor rope). Each has a life in seconds.
  const platforms = [];
  const enemySpawns = [];
  const pickupSpawns = [];
  const signs = [];
  const MARKERS = { g: "grunt", m: "mud_revenant", j: "rat_king", a: "archer", W: "warlord" };

  // Loads level i from LEVELS. Every system reads the current level through these values.
  function load(i) {
    index = i;
    const level = LEVELS[i];
    tiles = level.rows.map((row) => row.split(""));
    rows = tiles.length;
    cols = tiles[0].length;
    width = cols * TILE;
    height = rows * TILE;
    spawn = { x: 0, y: 0 };
    exit = null;
    platforms.length = 0;
    enemySpawns.length = 0;
    pickupSpawns.length = 0;
    signs.length = 0;
    let signN = 0;
    tiles.forEach((row, ty) =>
      row.forEach((ch, tx) => {
        if (ch === "S") spawn = { x: tx * TILE, y: ty * TILE };
        // The exit zone is 4 tiles tall, reaching 3 tiles above the flag, so a
        // jump that clears the flag's tile still completes the level.
        if (ch === "F") exit = { x: tx * TILE, y: (ty - 3) * TILE, w: TILE, h: 4 * TILE };
        if (MARKERS[ch]) enemySpawns.push({ kind: MARKERS[ch], x: tx * TILE, y: ty * TILE });
        if (ch === "c" || ch === "k" || ch === "p") {
          pickupSpawns.push({ power: ch === "p", secret: ch !== "k", x: tx * TILE, y: ty * TILE });
        }
        if (ch === "i") signs.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE, text: (level.signs || [])[signN++] || "" });
      })
    );
  }

  function setFlagOpen(open) {
    flagOpen = open;
  }

  // Flag pole and pennant on the exit tile.
  function drawFlag(ctx, px, py) {
    ctx.globalAlpha = flagOpen ? 1 : 0.3;
    ctx.fillStyle = "#5b4a3a";
    ctx.fillRect(px + 14, py - 24, 3, 56);
    ctx.fillStyle = "#e0b84a";
    ctx.beginPath();
    ctx.moveTo(px + 17, py - 24);
    ctx.lineTo(px + 30, py - 18);
    ctx.lineTo(px + 17, py - 12);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Sets one tile (used by tests and by the sign and spike code).
  function setTile(tx, ty, ch) {
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
    tiles[ty][tx] = ch;
  }

  function at(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return ".";
    return tiles[ty][tx];
  }

  function isSolid(ch) {
    return ch === "#" || ch === "=" || ch === "x";
  }

  // Breaks every cracked wall the box touches. Returns true if any broke.
  function breakCracked(x, y, w, h) {
    let broke = false;
    for (const c of overlapping(x, y, w, h)) {
      if (c.ch === "x") {
        setTile(c.tx, c.ty, ".");
        broke = true;
      }
    }
    return broke;
  }

  function isOneWay(ch) {
    return ch === "_";
  }

  // True when the point sits on a tile that can hold up a body.
  function isStandable(x, y) {
    const ch = at(Math.floor(x / TILE), Math.floor(y / TILE));
    return isSolid(ch) || isOneWay(ch);
  }

  // Tile cells the box overlaps. Callers pick which kinds they care about.
  function overlapping(x, y, w, h) {
    const x0 = Math.floor(x / TILE);
    const y0 = Math.floor(y / TILE);
    const x1 = Math.floor((x + w - 0.001) / TILE);
    const y1 = Math.floor((y + h - 0.001) / TILE);
    const out = [];
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        out.push({ tx, ty, ch: at(tx, ty) });
      }
    }
    return out;
  }

  // Move body e (x, y, w, h, vx, vy, grounded) by its velocity for one step.
  function moveBody(e, dt) {
    const prevBottom = e.y + e.h;

    // Horizontal first. Walls stop the body on the tile edge.
    e.x += e.vx * dt;
    for (const c of overlapping(e.x, e.y, e.w, e.h)) {
      if (!isSolid(c.ch)) continue;
      if (e.vx > 0) e.x = Math.min(e.x, c.tx * TILE - e.w);
      if (e.vx < 0) e.x = Math.max(e.x, (c.tx + 1) * TILE);
    }
    e.x = Math.max(0, Math.min(e.x, width - e.w));

    // Vertical second. Floors and ceilings stop the body on the tile edge.
    e.grounded = false;
    e.y += e.vy * dt;
    for (const c of overlapping(e.x, e.y, e.w, e.h)) {
      if (isSolid(c.ch)) {
        if (e.vy > 0) {
          e.y = c.ty * TILE - e.h;
          e.vy = 0;
          e.grounded = true;
        } else if (e.vy < 0) {
          e.y = (c.ty + 1) * TILE;
          e.vy = 0;
        }
      } else if (isOneWay(c.ch) && e.vy >= 0 && prevBottom <= c.ty * TILE + 0.5) {
        e.y = c.ty * TILE - e.h;
        e.vy = 0;
        e.grounded = true;
      }
    }
    for (const pl of platforms) {
      const overlapX = e.x + e.w > pl.x && e.x < pl.x + pl.w;
      if (overlapX && e.vy >= 0 && prevBottom <= pl.y + 0.5 && e.y + e.h >= pl.y) {
        e.y = pl.y - e.h;
        e.vy = 0;
        e.grounded = true;
      }
    }
  }

  function addPlatform(pl) {
    platforms.push(pl);
  }

  function updatePlatforms(dt) {
    for (let i = platforms.length - 1; i >= 0; i--) {
      platforms[i].life -= dt;
      if (platforms[i].life <= 0) platforms.splice(i, 1);
    }
  }

  function drawPlatforms(ctx, camX, camY) {
    for (const pl of platforms) {
      // Rope: a brown line with posts at both ends.
      ctx.fillStyle = pl.color || "#7a5230";
      ctx.fillRect(Math.round(pl.x - camX), Math.round(pl.y - camY), pl.w, 3);
      ctx.fillRect(Math.round(pl.x - camX), Math.round(pl.y - camY), 3, pl.h + 6);
      ctx.fillRect(Math.round(pl.x + pl.w - camX - 3), Math.round(pl.y - camY), 3, pl.h + 6);
    }
  }

  // Closest safe spot to (x, y) for a body of size w by h. A safe spot is a
  // standable tile with a clear 2 by 3 tile area above it, and no enemy
  // within 3 tiles. Searches up to 20 tiles out. Falls back to the spawn.
  function closestSafeSpace(x, y, w, h, enemies) {
    const cx = Math.min(cols - 1, Math.max(0, Math.floor((x + w / 2) / TILE)));
    const cy = Math.min(rows - 1, Math.max(0, Math.floor((y + h) / TILE)));
    const free = (ch) => !isSolid(ch) && !isOneWay(ch);
    let best = null;
    let bestDist = Infinity;

    for (let ty = cy - 20; ty <= cy + 20; ty++) {
      for (let tx = cx - 20; tx <= cx + 20; tx++) {
        const ground = at(tx, ty);
        if (!(isSolid(ground) || isOneWay(ground))) continue;
        let clear = true;
        for (let dy = 1; dy <= 3 && clear; dy++) {
          for (let dx = 0; dx <= 1 && clear; dx++) {
            clear = free(at(tx + dx, ty - dy));
          }
        }
        if (!clear) continue;
        // A spot is not safe if spikes lie within 3 columns on the body's row.
        let spiky = false;
        for (let dx = -3; dx <= 3; dx++) if (at(tx + dx, ty - 1) === "^") spiky = true;
        if (spiky) continue;

        const sx = tx * TILE + (TILE - w) / 2;
        const sy = ty * TILE - h;
        const near = enemies.some(
          (e) =>
            !e.dead &&
            Math.hypot(sx + w / 2 - (e.x + e.w / 2), sy + h / 2 - (e.y + e.h / 2)) < 3 * TILE
        );
        if (near) continue;

        const dist = Math.hypot(sx - x, sy - y);
        if (dist < bestDist) {
          bestDist = dist;
          best = { x: sx, y: sy };
        }
      }
    }
    return best || { x: spawn.x, y: spawn.y };
  }

  // A wall tile with dark zigzag cracks across it.
  function drawCracked(ctx, wallImg, px, py) {
    ctx.drawImage(wallImg, px, py, TILE, TILE);
    ctx.strokeStyle = "#2a1d14";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 4);
    ctx.lineTo(px + 12, py + 12);
    ctx.lineTo(px + 8, py + 20);
    ctx.lineTo(px + 22, py + 28);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // Sign posts from World.signs: a brown stick with a board on top.
  function drawSigns(ctx, camX, camY) {
    for (const sg of signs) {
      const px = Math.round(sg.x - camX);
      const py = Math.round(sg.y - camY);
      ctx.fillStyle = "#7a5230";
      ctx.fillRect(px + 14, py + 16, 4, 16);
      ctx.fillStyle = "#a87a4a";
      ctx.fillRect(px + 6, py + 4, 20, 12);
    }
  }

  // Three grey spikes standing on the bottom edge of the tile.
  function drawSpikes(ctx, px, py) {
    ctx.fillStyle = "#9aa0a8";
    ctx.strokeStyle = "#5b6068";
    for (let i = 0; i < 3; i++) {
      const x0 = px + 1 + i * 10;
      const base = py + TILE;
      ctx.beginPath();
      ctx.moveTo(x0, base);
      ctx.lineTo(x0 + 5, base - 12);
      ctx.lineTo(x0 + 10, base);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function draw(ctx, images, camX, camY, viewW, viewH) {
    const tx0 = Math.max(0, Math.floor(camX / TILE));
    const ty0 = Math.max(0, Math.floor(camY / TILE));
    const tx1 = Math.min(cols - 1, Math.floor((camX + viewW) / TILE));
    const ty1 = Math.min(rows - 1, Math.floor((camY + viewH) / TILE));

    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const ch = at(tx, ty);
        const px = Math.round(tx * TILE - camX);
        const py = Math.round(ty * TILE - camY);
        if (ch === "#") ctx.drawImage(images.wall, px, py, TILE, TILE);
        else if (ch === "x") drawCracked(ctx, images.wall, px, py);
        else if (ch === "=" && LEVELS[index].theme === "dungeon") {
          // Dungeon ground is bare dirt, shaded darker.
          ctx.drawImage(images.dirt, px, py, TILE, TILE);
          ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
          ctx.fillRect(px, py, TILE, TILE);
        } else if (ch === "=") {
          ctx.drawImage(images.dirt, px, py, TILE, TILE);
          ctx.drawImage(images.grass, px, py, TILE, TILE);
        } else if (ch === "_") {
          ctx.drawImage(images.grass, px, py, TILE, TILE);
        } else if (ch === "T" && LEVELS[index].theme !== "dungeon") {
          ctx.drawImage(images.tree, px, py, TILE, TILE);
        } else if (ch === "^") {
          drawSpikes(ctx, px, py);
        } else if (ch === "F") {
          drawFlag(ctx, px, py);
        }
      }
    }
  }

  const api = {
    TILE,
    get width() { return width; },
    get height() { return height; },
    get cols() { return cols; },
    get rows() { return rows; },
    get spawn() { return spawn; },
    get enemySpawns() { return enemySpawns; },
    get pickupSpawns() { return pickupSpawns; },
    get index() { return index; },
    get level() { return LEVELS[index]; },
    count: LEVELS.length,
    signs,
    exit: () => exit,
    at,
    setTile,
    isSolid,
    isStandable,
    breakCracked,
    moveBody,
    closestSafeSpace,
    addPlatform,
    updatePlatforms,
    drawPlatforms,
    platforms,
    draw,
    drawSigns,
    setFlagOpen,
    // Secrets (c and p markers) in level i.
    countSecrets: (i) => LEVELS[i].rows.reduce((n, row) => n + [...row].filter((ch) => ch === "c" || ch === "p").length, 0),
    THEMES,
    overlapping,
    load,
  };
  load(0);
  return api;
})();

// ---- cards.js ----
// Character cards, the 3-slot hand, and the deck.
const CARD_DEFS = {
  knight: { name: "Knight", color: "#8fa6c0" },
  ranger: { name: "Ranger", color: "#6f9c5a" },
  mage: { name: "Mage", color: "#9b7fd1" },
  rat: { name: "Rat", color: "#a0826d" },
  weaver: { name: "Bone Weaver", color: "#d8d2c0" },
};

// Hand fills left to right. Extra cards go into the deck at a random spot.
// Deck contents stay hidden; the HUD only shows the count.
// When a hand slot opens, the top card of the deck moves into it.
const Hand = (() => {
  const SLOTS = 3;
  const hand = new Array(SLOTS).fill(null);
  const deck = [];

  function refill() {
    for (let i = 0; i < SLOTS; i++) {
      if (hand[i] === null && deck.length > 0) hand[i] = deck.shift();
    }
  }

  // Returns where the card landed so the HUD can animate to it.
  function collect(cardId) {
    const free = hand.indexOf(null);
    if (free !== -1) {
      hand[free] = cardId;
      return { where: "hand", slot: free };
    }
    const at = Math.floor(Math.random() * (deck.length + 1));
    deck.splice(at, 0, cardId);
    return { where: "deck" };
  }

  function discard(slot) {
    const cardId = hand[slot];
    hand[slot] = null;
    refill();
    return cardId;
  }

  // Empties the hand and the deck. Called when a new game starts.
  function reset() {
    hand.fill(null);
    deck.length = 0;
  }

  // Plain data for the save file, and back again.
  function serialize() {
    return { hand: hand.slice(), deck: deck.slice() };
  }

  function restore(data) {
    for (let i = 0; i < SLOTS; i++) hand[i] = data.hand[i] || null;
    deck.length = 0;
    deck.push(...data.deck);
  }

  return {
    SLOTS,
    collect,
    discard,
    reset,
    serialize,
    restore,
    get: (slot) => hand[slot],
    slots: () => hand.slice(),
    deckCount: () => deck.length,
  };
})();

class Enemy {
  constructor(kind, x, y) {
    const def = ENEMY_DEFS[kind];
    this.kind = kind;
    this.def = def;
    this.x = x;
    this.y = y;
    this.w = def.w;
    this.h = def.h;
    this.vx = 0;
    this.vy = 0;
    this.grounded = false;
    this.dir = -1;
    this.dead = false;
    this.stunT = 0;
    this.jumpT = def.jumpEvery || 0;
    this.fireT = def.fireEvery || 0;
    this.hp = def.hp || 1;
    this.hurtT = 0;
  }

  // Jump on a timer while the enemy is on the ground and the player is near.
  tryJump(dt, chasing) {
    const d = this.def;
    this.jumpT -= dt;
    if (this.grounded && chasing && this.jumpT <= 0) {
      this.vy = d.jumpVy;
      this.jumpT = d.jumpEvery;
    }
  }

  // Fire a hostile arrow on a timer while the player is lined up.
  tryFire(dt, chasing, dx) {
    const d = this.def;
    this.fireT -= dt;
    if (chasing && this.fireT <= 0) {
      this.dir = dx >= 0 ? 1 : -1;
      Attacks.fireHostile(this.x + this.w / 2, this.y + 12, this.dir);
      this.fireT = d.fireEvery;
    }
  }

  update(dt, player) {
    const d = this.def;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2);
    const dy = player.y + player.h / 2 - (this.y + this.h / 2);
    const chasing = Math.abs(dx) < d.sight && Math.abs(dy) < 64;
    if (this.hurtT > 0) this.hurtT -= dt;

    if (this.stunT > 0) {
      // Stunned by shield bash: no walking or chasing, gravity still applies.
      this.stunT -= dt;
      this.vx = 0;
      this.vy = Math.min(this.vy + 900 * dt, 600);
      World.moveBody(this, dt);
      return;
    }

    if (d.jumpVy) this.tryJump(dt, chasing);
    if (d.fireEvery) this.tryFire(dt, chasing, dx);

    if (chasing) {
      this.dir = dx >= 0 ? 1 : -1;
      this.vx = this.dir * d.chaseSpeed;
    } else {
      // Patrol: turn around at walls and at ledges.
      this.vx = this.dir * d.speed;
    }

    const before = this.x;
    this.vy = Math.min(this.vy + 900 * dt, 600);
    World.moveBody(this, dt);

    if (!chasing) {
      const blocked = this.grounded && Math.abs(this.x - before) < 0.01;
      const aheadX = this.dir > 0 ? this.x + this.w + 2 : this.x - 2;
      const footY = this.y + this.h + 2;
      const groundAhead = World.isStandable(aheadX, footY);
      if (blocked || !groundAhead) this.dir = -this.dir;
    }
  }

  draw(ctx, images, camX, camY) {
    // Hurt enemies blink: skip every other 0.1 s.
    if (this.hurtT > 0 && Math.floor(this.hurtT / 0.1) % 2 === 0) return;
    const img = images[this.def.sprite];
    const dw = this.def.drawW || 48;
    const dh = this.def.drawH || 48;
    const sx = Math.round(this.x + this.w / 2 - dw / 2 - camX);
    const sy = Math.round(this.y + this.h - dh - camY);
    ctx.save();
    if (this.dir > 0) {
      ctx.translate(sx + dw, sy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, dw, dh);
    } else {
      ctx.drawImage(img, sx, sy, dw, dh);
    }
    ctx.restore();
  }
}

// A card on the ground. Falls with gravity until the player touches it.
// cardId is a character id, or "random" to pick one when it is collected.
// A power-up is a gold pickup. It draws one card and then one more.
class CardPickup {
  constructor(cardId, x, y, { power = false, pop = true, secret = false } = {}) {
    this.cardId = cardId;
    this.power = power;
    this.secret = secret;
    this.x = x;
    this.y = y;
    this.w = 14;
    this.h = 18;
    this.vx = 0;
    this.vy = pop ? -120 : 0;
    this.grounded = false;
    this.state = "ground"; // ground, flying, done
    this.t = 0;
  }

  update(dt) {
    if (this.state !== "ground") return;
    this.vy = Math.min(this.vy + 900 * dt, 600);
    World.moveBody(this, dt);
  }

  draw(ctx, camX, camY, flyTo) {
    let sx;
    let sy;
    if (this.state === "flying") {
      const k = 1 - Math.pow(1 - Math.min(this.t / 0.3, 1), 3);
      sx = this.screenFrom.x + (flyTo.x - this.screenFrom.x) * k;
      sy = this.screenFrom.y + (flyTo.y - this.screenFrom.y) * k;
    } else {
      sx = this.x - camX;
      sy = this.y - camY;
    }
    // Unrolled cards (cardId "random") are drawn grey until they are collected.
    const def = this.power ? { color: "#e0b84a" } : CARD_DEFS[this.cardId] || { color: "#b8b8b8" };
    ctx.fillStyle = def.color;
    ctx.fillRect(Math.round(sx), Math.round(sy), this.w, this.h);
    ctx.strokeStyle = "#111418";
    ctx.strokeRect(Math.round(sx) + 0.5, Math.round(sy) + 0.5, this.w - 1, this.h - 1);
  }
}

// Visual effects: defeat bursts and a short screen shake. Drawn in code.
const Effects = {
  shakeT: 0,
  bursts: [],
  burst(x, y, color) {
    const parts = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      parts.push({ x, y, vx: Math.cos(a) * 60, vy: -80 + Math.sin(a) * 30 });
    }
    this.bursts.push({ parts, color, t: 0 });
  },
  update(dt) {
    if (this.shakeT > 0) this.shakeT -= dt;
    for (const b of this.bursts) {
      b.t += dt;
      for (const q of b.parts) {
        q.vy += 400 * dt;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
      }
    }
    this.bursts = this.bursts.filter((b) => b.t < 0.4);
  },
  draw(ctx, camX, camY) {
    for (const b of this.bursts) {
      ctx.globalAlpha = 1 - b.t / 0.4;
      ctx.fillStyle = b.color;
      for (const q of b.parts) ctx.fillRect(Math.round(q.x - camX), Math.round(q.y - camY), 4, 4);
    }
    ctx.globalAlpha = 1;
  },
};

// Places enemies and card pickups for one level, and runs their updates.
const Enemies = (() => {
  let list = [];
  let pickups = [];

  function spawnFromLevel() {
    list = World.enemySpawns.map((s) => new Enemy(s.kind, s.x, s.y));
    pickups = World.pickupSpawns.map(
      (s) => new CardPickup("random", s.x, s.y, { power: s.power, pop: false, secret: s.secret })
    );
  }

  function dropCard(enemy) {
    const cardId = ENEMY_DEFS[enemy.kind].card;
    pickups.push(new CardPickup(cardId, enemy.x + enemy.w / 2 - 7, enemy.y));
  }

  // Removes an enemy and drops its card. Used by stomps, melee, and arrows.
  // A hit. Enemies with more than 1 hp survive and flash for 0.6 s.
  function defeat(enemy) {
    if (enemy.dead || enemy.hurtT > 0) return;
    if (enemy.hp > 1) {
      enemy.hp -= 1;
      enemy.hurtT = 0.6;
      Sfx.play(enemy.kind === "warlord" ? "boss" : "hit");
      if (enemy.kind === "warlord") Effects.shakeT = 0.15;
      return;
    }
    enemy.dead = true;
    Sfx.play("hit");
    Effects.burst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, CARD_DEFS[ENEMY_DEFS[enemy.kind].card].color);
    dropCard(enemy);
  }

  return {
    spawnFromLevel,
    dropCard,
    defeat,
    list: () => list,
    pickups: () => pickups,
    cleanup: () => {
      list = list.filter((e) => !e.dead);
      pickups = pickups.filter((p) => p.state !== "done");
    },
  };
})();

  },

    abilities: ["spell_bolt", "float", "slash", "blink"],

const ABILITY_NAMES = {
  shield_bash: "Shield bash",
  charge: "Charge",
  slash: "Slash",
  thrust: "Thrust",
  shoot: "Shoot",
  arrow_anchor: "Arrow anchor",
  hop: "Hop",
  spell_bolt: "Spell bolt",
  float: "Float",
  blink: "Blink",
  leap: "Leap",
  scurry: "Scurry",
  bone_bridge: "Bone bridge",
  ghost: "Ghost",
};

// Attacks in flight: melee hitboxes, projectiles, and rope platforms.
// The scene calls update and draw. Effects that touch enemies go through
// Enemies.defeat and stun.
const Attacks = (() => {
  const hitboxes = [];
  const projectiles = [];
  // Enemy arrows. They fly until they hit a wall or the player.
  const hostile = [];
  const MAX_PROJECTILES = 2;

  function faceRect(p, reach, h, dy) {
    const x = p.facing > 0 ? p.x + p.w : p.x - reach;
    return { x, y: p.y + dy, w: reach, h };
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Fires one ability for the scene's player. Timed effects (charge, float)
  // are stored on the scene and read in its update.
  function use(id, scene) {
    const p = scene.player;
    Sfx.play("ability");
    switch (id) {
      case "slash":
        hitboxes.push({ ...faceRect(p, 36, 24, 4), t: 0.15, kind: "slash" });
        break;
      case "thrust":
        hitboxes.push({ ...faceRect(p, 56, 12, 10), t: 0.15, kind: "thrust" });
        break;
      case "shield_bash":
        hitboxes.push({ ...faceRect(p, 22, 30, 0), t: 0.12, kind: "bash", stun: 1.2 });
        break;
      case "charge":
        scene.dashT = 0.25;
        break;
      case "shoot":
      case "spell_bolt": {
        const magic = id === "spell_bolt";
        const live = projectiles.filter((q) => q.owner === scene.active).length;
        if (live >= MAX_PROJECTILES) break;
        projectiles.push({
          x: p.facing > 0 ? p.x + p.w : p.x - 8,
          y: p.y + 12,
          w: 8,
          h: 4,
          vx: p.facing * (magic ? 300 : 380),
          life: 1.2,
          owner: scene.active,
          kind: id,
        });
        break;
      }
      case "arrow_anchor": {
        // Rope platform three tiles long, one tile in front, two tiles above the feet.
        const x = p.facing > 0 ? p.x + p.w + 4 : p.x - 4 - 3 * World.TILE;
        const y = p.y + p.h - 2 * World.TILE;
        World.addPlatform({ x, y, w: 3 * World.TILE, h: 6, life: 6 });
        break;
      }
      case "bone_bridge": {
        // Bone bridge: the anchor, but 5 tiles long and it lasts longer.
        const x = p.facing > 0 ? p.x + p.w + 4 : p.x - 4 - 5 * World.TILE;
        const y = p.y + p.h - 2 * World.TILE;
        World.addPlatform({ x, y, w: 5 * World.TILE, h: 6, life: 8, color: "#e8e2d0" });
        break;
      }
      case "ghost":
        // Ghost: enemy contact and arrows pass through for a short time.
        scene.ghostT = 1.5;
        break;
      case "float":
        scene.floatT = 1.2;
        break;
      case "blink":
        blink(p);
        break;
      case "leap":
        // Rat leap: a high jump from the ground, about 5 tiles.
        if (p.grounded) {
          p.vy = -540;
          p.jumping = false;
        }
        break;
      case "scurry":
        scene.scurryT = 2.0;
        break;
      case "hop":
        if (!p.grounded && !p.hopUsed) {
          p.vy = -300;
          p.hopUsed = true;
        }
        break;
      default:
        break;
    }
  }

  // Teleport forward up to 96 px. Shorter steps are tried if the target is solid.
  function blink(p) {
    for (const dist of [96, 64, 32]) {
      const nx = p.x + p.facing * dist;
      const clear = World.overlapping(nx, p.y, p.w, p.h).every((c) => {
        const ch = c.ch;
        return !World.isSolid(ch);
      });
      if (clear) {
        p.x = Math.max(0, Math.min(nx, World.width - p.w));
        return;
      }
    }
  }

  function update(dt) {
    for (const hb of hitboxes) {
      hb.t -= dt;
      if (hb.kind === "bash") World.breakCracked(hb.x, hb.y, hb.w, hb.h);
      Enemies.list().forEach((e) => {
        if (e.dead || !overlaps(hb, e)) return;
        if (hb.stun) e.stunT = hb.stun;
        else Enemies.defeat(e);
      });
    }
    for (let i = hitboxes.length - 1; i >= 0; i--) {
      if (hitboxes[i].t <= 0) hitboxes.splice(i, 1);
    }

    for (const q of projectiles) {
      q.life -= dt;
      q.x += q.vx * dt;
      if (World.overlapping(q.x, q.y, q.w, q.h).some((c) => World.isSolid(c.ch))) q.life = 0;
      for (const e of Enemies.list()) {
        if (!e.dead && overlaps(q, e)) {
          Enemies.defeat(e);
          q.life = 0;
        }
      }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      if (projectiles[i].life <= 0) projectiles.splice(i, 1);
    }

    for (const h of hostile) {
      h.life -= dt;
      h.x += h.vx * dt;
      if (World.overlapping(h.x, h.y, h.w, h.h).some((c) => World.isSolid(c.ch))) h.life = 0;
    }
    for (let i = hostile.length - 1; i >= 0; i--) {
      if (hostile[i].life <= 0) hostile.splice(i, 1);
    }
  }

  function draw(ctx, cx, cy) {
    for (const hb of hitboxes) {
      ctx.fillStyle = hb.kind === "bash" ? "rgba(200, 220, 255, 0.6)" : "rgba(255, 255, 255, 0.55)";
      ctx.fillRect(Math.round(hb.x - cx), Math.round(hb.y - cy), hb.w, hb.h);
    }
    for (const q of projectiles) {
      ctx.fillStyle = q.kind === "spell_bolt" ? "#b9a2f0" : "#e8e4d8";
      ctx.fillRect(Math.round(q.x - cx), Math.round(q.y - cy), q.w, q.h);
    }
    for (const h of hostile) {
      ctx.fillStyle = "#c2452d";
      ctx.fillRect(Math.round(h.x - cx), Math.round(h.y - cy), h.w, h.h);
    }
  }

  function fireHostile(x, y, dir) {
    hostile.push({ x, y, w: 8, h: 4, vx: dir * 240, life: 2.5 });
  }

  // True if a hostile arrow hits the body. The arrow is used up on contact.
  function hitByHostile(body) {
    for (const h of hostile) {
      if (h.life > 0 && overlaps(h, body)) {
        h.life = 0;
        return true;
      }
    }
    return false;
  }

  function reset() {
    hitboxes.length = 0;
    projectiles.length = 0;
    hostile.length = 0;
  }

  return { use, update, draw, fireHostile, hitByHostile, hostileCount: () => hostile.length, reset };
})();

// Scenes: the input test screen and the play slice.

// Shows every logical action and lights it while it is held.
class InputTestScene {
  constructor() {
    this.labels = [
      ["left", "Left"],
      ["right", "Right"],
      ["up", "Jump"],
      ["down", "Down"],
      ["ab1", "A / X"],
      ["ab2", "S / Y"],
      ["ab3", "Z / A"],
      ["ab4", "X / B"],
      ["discardSelf", "Q"],
      ["discardCard", "C"],
      ["start", "Enter / Start"],
    ];
    this.flash = {};
  }

  update(dt) {
    for (const [action] of this.labels) {
      if (Input.pressed(action)) this.flash[action] = 0.3;
      else if (this.flash[action] > 0) this.flash[action] -= dt;
    }
    if (menuBack()) Engine.setScene(new TitleScene());
  }

  draw(ctx) {
    ctx.fillStyle = "#1b2430";
    ctx.fillRect(0, 0, Engine.W, Engine.H);

    ctx.fillStyle = "#e8e4d8";
    ctx.font = "16px system-ui, sans-serif";
    ctx.fillText("Input check", 16, 28);
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillStyle = "#9fb0c0";
    ctx.fillText("Press each key or button. X or B returns to the title.", 16, 46);

    this.labels.forEach(([action, label], i) => {
      const col = i % 4;
      const row = Math.floor(i / 4);
      const x = 16 + col * 112;
      const y = 66 + row * 42;
      const held = Input.down(action);
      const flashing = (this.flash[action] || 0) > 0;
      ctx.fillStyle = held ? "#d9a441" : flashing ? "#6d8ea8" : "#2a3644";
      ctx.fillRect(x, y, 100, 32);
      ctx.fillStyle = held ? "#111418" : "#e8e4d8";
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillText(label, x + 8, y + 20);
    });
  }
}

// Shared menu helpers. Up and Down move the choice, Z or A or Enter confirms,
// X or B or Q backs out.
function menuStep(sel, count) {
  let next = sel;
  if (Input.pressed("up")) next = (sel + count - 1) % count;
  if (Input.pressed("down")) next = (sel + 1) % count;
  return next;
}

function menuConfirm() {
  return Input.pressed("ab3") || Input.pressed("start");
}

function menuBack() {
  return Input.pressed("ab4") || Input.pressed("discardSelf");
}

function drawMenu(ctx, title, items, sel, footer) {
  ctx.fillStyle = "#1b2430";
  ctx.fillRect(0, 0, Engine.W, Engine.H);
  ctx.fillStyle = "#e8e4d8";
  ctx.textAlign = "center";
  ctx.font = "22px system-ui, sans-serif";
  ctx.fillText(title, Engine.W / 2, 74);
  ctx.font = "14px system-ui, sans-serif";
  items.forEach((label, i) => {
    const y = 120 + i * 30;
    ctx.fillStyle = i === sel ? "#d9a441" : "#e8e4d8";
    ctx.fillText((i === sel ? "> " : "  ") + label, Engine.W / 2, y);
  });
  ctx.font = "11px system-ui, sans-serif";
  ctx.fillStyle = "#9fb0c0";
  ctx.fillText(footer, Engine.W / 2, Engine.H - 16);
  ctx.textAlign = "left";
}

// Title screen: start, input check, credits.
// Save for Continue: the level, character, hand, and run stats, in localStorage.
// Every call is guarded, since storage can be blocked.
const SaveGame = {
  key: "changeling_save",
  save(data) {
    try {
      localStorage.setItem(this.key, JSON.stringify(data));
    } catch (e) {
      /* storage unavailable: no save */
    }
  },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },
  clear() {
    try {
      localStorage.removeItem(this.key);
    } catch (e) {
      /* storage unavailable */
    }
  },
};

// Stats for the whole run, shown at the end.
const Run = { deaths: 0, secrets: 0, startTime: 0 };

function newRun() {
  Run.deaths = 0;
  Run.secrets = 0;
  Run.startTime = performance.now();
}

class TitleScene {
  constructor() {
    const saved = SaveGame.load();
    this.items = saved ? ["Continue", "New game", "Input check", "Credits"] : ["Play", "Input check", "Credits"];
    this.sel = 0;
    this.saved = saved;
  }

  update() {
    this.sel = menuStep(this.sel, this.items.length);
    if (!menuConfirm()) return;
    const choice = this.items[this.sel];
    if (choice === "Continue") {
      Hand.restore(this.saved.cards);
      Object.assign(Run, this.saved.run);
      Engine.setScene(new PlayScene(this.saved.level, this.saved.active));
    } else if (choice === "Play" || choice === "New game") {
      SaveGame.clear();
      Hand.reset();
      newRun();
      Engine.setScene(new IntroScene());
    } else if (choice === "Input check") {
      Engine.setScene(new InputTestScene());
    } else if (choice === "Credits") {
      Engine.setScene(new CreditsScene());
    }
  }

  draw(ctx) {
    drawMenu(ctx, "Changeling", this.items, this.sel, "Knight of a thousand faces");
  }
}

// Credits: sources and licenses for the art and code.
// Ending screen. Shown after the last level. Text is filled in by task F2.
class EndingScene {
  constructor() {
    this.total = 0;
    for (let i = 0; i < World.count; i++) this.total += World.countSecrets(i);
    const secs = Math.floor((performance.now() - Run.startTime) / 1000);
    const mm = String(Math.floor(secs / 60)).padStart(2, "0");
    const ss = String(secs % 60).padStart(2, "0");
    this.stats = "Deaths: " + Run.deaths + "    Secrets: " + Run.secrets + " of " + this.total + "    Time: " + mm + ":" + ss;
    SaveGame.clear();
  }

  update() {
    if (menuConfirm()) Engine.setScene(new CreditsScene());
  }

  draw(ctx) {
    ctx.fillStyle = "#1b2430";
    ctx.fillRect(0, 0, Engine.W, Engine.H);
    ctx.fillStyle = "#e8e4d8";
    ctx.textAlign = "center";
    ctx.font = "14px system-ui, sans-serif";
    ctx.fillText("The Warlord falls. The faces return to their owners.", Engine.W / 2, 80);
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText(this.stats, Engine.W / 2, 116);
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText("Thanks for playing.", Engine.W / 2, 146);
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillText("Enter: credits", Engine.W / 2, 180);
    ctx.textAlign = "left";
  }
}

// Black screen with three lines shown one at a time, then Enter to begin.
class IntroScene {

// Splits text into lines no wider than maxW pixels, at word boundaries.
function wrapText(ctx, text, maxW) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const trial = line ? line + " " + w : w;
    if (ctx.measureText(trial).width > maxW && line) {
      lines.push(line);
      line = w;
    } else {
      line = trial;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Far background ridge. Drawn at a fraction of the camera's x so it scrolls
// slower than the level (parallax). Procedural, so it needs no asset.
function drawHills(ctx, scrollX, color, baseY, freq, amp) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, Engine.H);
  for (let x = 0; x <= Engine.W; x += 4) {
    const wx = x + scrollX;
    const y = baseY - Math.sin(wx * freq) * amp - Math.sin(wx * freq * 0.37 + 1.3) * amp * 0.6;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(Engine.W, Engine.H);
  ctx.closePath();
  ctx.fill();
}

// Play slice: walk, jump, stomp, collect cards, die, pick a card, respawn.
//
// Modes:
//   play         normal play
//   select       after a death or a discard: pick a hand card to become
//   discardCard  pick a hand card to throw away (game paused)
//   complete     the exit flag was reached
//   pause        the pause menu: resume or back to title
class PlayScene {
  constructor(levelIndex = 0, active = "knight") {
    World.load(levelIndex);
    Attacks.reset();
    this.images = {
      knight: IMG.knight_right,
      ranger_right: IMG.ranger_right,
      grunt: IMG.grunt,
      mud_revenant: IMG.mud_revenant,
      rat_king: IMG.rat_king,
      bone_weaver: IMG.bone_weaver,
      wall: IMG.wall,
      grass: IMG.grass,
      dirt: IMG.dirt,
      tree: IMG.tree,
      mage: IMG.mage,
      warlord: IMG.warlord,
    };
    this.cam = { x: 0, y: 0 };
    this.active = active;
    this.mode = "play";
    this.reason = "";
    this.sel = 0;
    this.deathPos = { x: 0, y: 0 };
    this.downActive = false;
    this.downTime = 0;
    this.downFired = false;
    this.dashT = 0;
    this.floatT = 0;
    this.scurryT = 0;
    this.ghostT = 0;
    this.pauseSel = 0;
    this.flashT = 0;
    this.secretsFound = 0;
    this.secretsTotal = World.countSecrets(World.index);
    this.bannerT = 2.5;
    this.player = this.newBody(World.spawn.x, World.spawn.y);
    Enemies.spawnFromLevel();
    if (World.index >= 1) SaveGame.save({ level: World.index, active: this.active, cards: Hand.serialize(), run: { ...Run } });
  }

  newBody(x, y) {
    return { x, y, w: 18, h: 30, vx: 0, vy: 0, grounded: false, facing: 1, jumping: false, hopUsed: false };
  }

  update(dt) {
    if (this.mode === "select") this.updateSelect();
    else if (this.mode === "discardCard") this.updateDiscardCard();
    else if (this.mode === "complete") {
      if (Input.pressed("start")) {
        const more = World.index + 1 < World.count;
        Engine.setScene(more ? new PlayScene(World.index + 1, this.active) : new EndingScene());
      }
    } else if (this.mode === "pause") this.updatePause();
    else this.updatePlay(dt);
  }

  updatePlay(dt) {
    if (Input.pressed("start")) {
      this.mode = "pause";
      this.pauseSel = 0;
      return;
    }
    this.handleDiscardKeys(dt);
    if (this.mode !== "play") return;

    const p = this.player;
    const move = (Input.down("right") ? 1 : 0) - (Input.down("left") ? 1 : 0);

    if (move !== 0) p.facing = move;
    // Rat scurry: faster walking for a short time.
    if (this.scurryT > 0) this.scurryT -= dt;
    p.vx = move * (this.scurryT > 0 ? 220 : 130);
    if (this.dashT > 0) {
      this.dashT -= dt;
      p.vx = p.facing * 320;
    }

    if (p.grounded) p.hopUsed = false;
    if (Input.pressed("up") && p.grounded) {
      p.vy = -340;
      Sfx.play("jump");
      p.jumping = true;
    }
    // Releasing jump early cuts the arc short.
    if (p.jumping && !Input.down("up") && p.vy < 0) {
      p.vy *= 0.5;
      p.jumping = false;
    }

    // Abilities 1 to 4 fire the active character's ability in that slot.
    const abilities = CHARACTERS[this.active].abilities;
    for (let i = 0; i < abilities.length; i++) {
      if (Input.pressed("ab" + (i + 1))) Attacks.use(abilities[i], this);
    }

    // Float: hold Up to climb at 120 px/s. Without Up, the fall is slowed.
    if (this.floatT > 0) {
      this.floatT -= dt;
      p.vy = Input.down("up") ? -120 : Math.min(p.vy + 200 * dt, 40);
    } else {
      p.vy = Math.min(p.vy + 900 * dt, 600);
    }
    const prevBottom = p.y + p.h;
    // A charge breaks cracked walls it runs into.
    if (this.dashT > 0) World.breakCracked(p.facing > 0 ? p.x + p.w : p.x - 6, p.y, 6, p.h);
    World.moveBody(p, dt);
    // Spikes are deadly: the bottom of the body touching one opens the selection.
    if (World.overlapping(p.x + 2, p.y + p.h - 8, p.w - 4, 8).some((c) => c.ch === "^")) {
      this.beginSelection("slain");
      return;
    }

    for (const enemy of Enemies.list()) {
      if (enemy.dead) continue;
      enemy.update(dt, p);
    }
    Attacks.update(dt);
    World.updatePlatforms(dt);
    if (this.ghostT > 0) this.ghostT -= dt;
    if (this.bannerT > 0) this.bannerT -= dt;
    if (this.flashT > 0) this.flashT -= dt;
    Effects.update(dt);
    this.checkEnemyContact(p, prevBottom);
    if (this.mode !== "play") return;
    if (this.ghostT <= 0 && Attacks.hitByHostile(p)) {
      this.beginSelection("slain");
      return;
    }

    for (const pickup of Enemies.pickups()) {
      pickup.update(dt);
      if (pickup.state === "ground" && this.overlaps(p, pickup)) {
        this.startCollect(pickup);
      }
      if (pickup.state === "flying") {
        pickup.t += dt;
        if (pickup.t >= 0.3) {
          Hand.collect(pickup.cardId);
          Sfx.play("pickup");
          if (pickup.secret) {
            Run.secrets += 1;
            this.secretsFound += 1;
          }
          // A power-up also draws one more random card.
          if (pickup.power) Hand.collect(Object.keys(CARD_DEFS)[Math.floor(Math.random() * Object.keys(CARD_DEFS).length)]);
          pickup.state = "done";
        }
      }
    }
    Enemies.cleanup();

    // Camera eases toward the player and stays inside the level.
    const targetX = p.x + p.w / 2 - Engine.W / 2;
    const targetY = p.y + p.h / 2 - Engine.H / 2;
    this.cam.x += (targetX - this.cam.x) * 0.15;
    this.cam.y += (targetY - this.cam.y) * 0.15;
    this.cam.x = Math.max(0, Math.min(this.cam.x, World.width - Engine.W));
    this.cam.y = Math.max(0, Math.min(this.cam.y, World.height - Engine.H));

    if (p.y > World.height) this.beginSelection("fell");

    // Standing at a sign shows its text.
    this.signText = "";
    for (const sg of World.signs) {
      if (this.overlaps(p, sg)) this.signText = sg.text;
    }

    // A boss level keeps the exit closed while a warlord is alive.
    const bossLocked = World.level.boss && Enemies.list().some((e) => e.kind === "warlord" && !e.dead);
    World.setFlagOpen(!bossLocked);
    const exit = World.exit();
    if (exit && this.mode === "play" && !bossLocked && this.overlaps(p, exit)) {
      this.mode = "complete";
      Sfx.play("complete");
    }
  }

  updatePause() {
    this.pauseSel = menuStep(this.pauseSel, 3);
    if (menuBack()) this.mode = "play";
    if (menuConfirm()) {
      if (this.pauseSel === 0) this.mode = "play";
      else if (this.pauseSel === 1) Sfx.enabled = !Sfx.enabled;
      else Engine.setScene(new TitleScene());
    }
  }

  // Hold Down for 0.5 s to discard the current character.
  // A quick Down tap, or C, opens discard-card mode. The press edge starts
  // the timer, so a tap shorter than one step still counts.
  handleDiscardKeys(dt) {
    if (Input.pressed("down")) {
      this.downActive = true;
      this.downTime = 0;
      this.downFired = false;
    }
    if (this.downActive) {
      if (Input.down("down")) {
        this.downTime += dt;
        if (!this.downFired && this.downTime >= 0.5) {
          this.downFired = true;
          this.downActive = false;
          this.beginSelection("discarded");
          return;
        }
      } else {
        if (!this.downFired) this.openDiscardCard();
        this.downActive = false;
      }
    }
    if (Input.pressed("discardCard")) this.openDiscardCard();
    if (Input.pressed("discardSelf")) {
      this.beginSelection("discarded");
      return;
    }
  }

  openDiscardCard() {
    this.mode = "discardCard";
    this.sel = this.firstOccupied();
  }

  overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // A stomp needs the player falling and above the enemy's top on the last step.
  checkEnemyContact(p, prevBottom) {
    // Right after a respawn the player is safe for one second.
    if (this.flashT > 0) return;
    for (const enemy of Enemies.list()) {
      if (enemy.dead || !this.overlaps(p, enemy)) continue;
      const stomp = p.vy > 0 && prevBottom <= enemy.y + 6;
      if (stomp) {
        Enemies.defeat(enemy);
        p.vy = -260;
      } else if (this.ghostT <= 0) {
        this.beginSelection("slain");
        return;
      }
    }
  }

  // Death or discard: the current character is lost. The player picks a
  // hand card to become. With an empty hand, the Knight returns.
  beginSelection(reason) {
    this.reason = reason;
    Sfx.play("hurt");
    if (reason !== "discarded") Run.deaths += 1;
    this.deathPos = { x: this.player.x, y: this.player.y };
    if (Hand.slots().every((c) => c === null)) {
      this.respawn("knight");
      return;
    }
    this.mode = "select";
    this.sel = this.firstOccupied();
  }

  updateSelect() {
    const dir = (Input.pressed("right") ? 1 : 0) - (Input.pressed("left") ? 1 : 0);
    if (dir) this.sel = this.nextOccupied(this.sel, dir);
    if (Input.pressed("ab3")) {
      const cardId = Hand.discard(this.sel);
      this.respawn(cardId);
    }
  }

  updateDiscardCard() {
    const dir = (Input.pressed("right") ? 1 : 0) - (Input.pressed("left") ? 1 : 0);
    if (dir) this.sel = this.nextOccupied(this.sel, dir);
    if (Input.pressed("discardCard") || Input.pressed("down")) {
      if (Hand.get(this.sel)) {
        Hand.discard(this.sel);
        this.mode = "play";
        this.sel = this.firstOccupied();
      }
    }
    if (Input.pressed("ab4")) this.mode = "play";
  }

  respawn(cardId) {
    const spot = World.closestSafeSpace(this.deathPos.x, this.deathPos.y, 18, 30, Enemies.list());
    this.player = this.newBody(spot.x, spot.y);
    this.active = cardId;
    this.mode = "play";
    this.dashT = 0;
    this.floatT = 0;
    this.scurryT = 0;
    this.ghostT = 0;
    this.flashT = 1.0;
    Attacks.reset();
  }

  firstOccupied() {
    const i = Hand.slots().findIndex((c) => c !== null);
    return i === -1 ? 0 : i;
  }

  // Next filled slot in direction dir (1 or -1). Stays put if none.
  nextOccupied(from, dir) {
    const slots = Hand.slots();
    for (let i = from + dir; i >= 0 && i < slots.length; i += dir) {
      if (slots[i] !== null) return i;
    }
    return from;
  }

  startCollect(pickup) {
    if (pickup.cardId === "random") {
      const ids = Object.keys(CARD_DEFS);
      pickup.cardId = ids[Math.floor(Math.random() * ids.length)];
    }
    pickup.state = "flying";
    pickup.t = 0;
    pickup.screenFrom = { x: pickup.x - this.cam.x, y: pickup.y - this.cam.y };
    pickup.target = this.targetFor(pickup.cardId);
  }

  // Screen position of the hand slot (or the deck box) the card flies into.
  targetFor(cardId) {
    const free = Hand.slots().indexOf(null);
    if (free !== -1) return HUD.slotRect(free);
    return HUD.deckRect();
  }

  draw(ctx) {
    const theme = THEMES[World.level.theme];
    ctx.fillStyle = theme.sky;
    ctx.fillRect(0, 0, Engine.W, Engine.H);

    const cx = Math.round(this.cam.x);
    const cy = Math.round(this.cam.y);
    drawHills(ctx, cx * 0.25, theme.far, 150, 0.012, 14);
    drawHills(ctx, cx * 0.5, theme.near, 190, 0.02, 20);
    World.draw(ctx, this.images, cx, cy, Engine.W, Engine.H);
    // Screen shake after a warlord hit (the engine resets the transform each frame).
    if (Effects.shakeT > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * 3), Math.round((Math.random() * 2 - 1) * 3));
    World.drawSigns(ctx, cx, cy);
    World.drawPlatforms(ctx, cx, cy);
    Attacks.draw(ctx, cx, cy);

    for (const enemy of Enemies.list()) {
      if (!enemy.dead) enemy.draw(ctx, this.images, cx, cy);
    }
    Effects.draw(ctx, cx, cy);
    for (const pickup of Enemies.pickups()) {
      if (pickup.state !== "done") pickup.draw(ctx, cx, cy, pickup.target || { x: 0, y: 0 });
    }

    if (this.mode === "play" || this.mode === "discardCard") this.drawBody(ctx, cx, cy);

    if (this.mode === "pause") {
      HUD.draw(ctx, -1);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, Engine.W, Engine.H);
      ctx.fillStyle = "#e8e4d8";
      ctx.textAlign = "center";
      ctx.font = "16px system-ui, sans-serif";
      ctx.fillText("Paused", Engine.W / 2, 110);
      ctx.font = "14px system-ui, sans-serif";
      ["Resume", "Sound: " + (Sfx.enabled ? "On" : "Off"), "Title screen"].forEach((label, i) => {
        ctx.fillStyle = i === this.pauseSel ? "#d9a441" : "#e8e4d8";
        ctx.fillText((i === this.pauseSel ? "> " : "  ") + label, Engine.W / 2, 144 + i * 26);
      });
      ctx.textAlign = "left";
    } else if (this.mode === "complete") {
      HUD.draw(ctx, -1);
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, Engine.W, Engine.H);
      ctx.fillStyle = "#e8e4d8";
      ctx.textAlign = "center";
      ctx.font = "16px system-ui, sans-serif";
      ctx.fillText("Level complete", Engine.W / 2, 110);
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillText("Secrets found: " + this.secretsFound + " of " + this.secretsTotal, Engine.W / 2, 128);
      ctx.font = "11px system-ui, sans-serif";
      const more = World.index + 1 < World.count;
      ctx.fillText(more ? "Enter: next level" : "Enter: continue", Engine.W / 2, 146);
      ctx.textAlign = "left";
    } else if (this.mode === "discardCard") {
      HUD.draw(ctx, this.sel);
      this.drawBanner(ctx, "Discard: Left/Right to choose. C or Down to discard. X or B to cancel.");
    } else if (this.mode === "select") {
      HUD.draw(ctx, -1);
      this.drawSelect(ctx);
    } else {
      HUD.draw(ctx, -1);
      this.drawBanner(ctx, CHARACTERS[this.active].name + ". Left/Right walk, Up jump, A S Z X abilities.");
      this.drawSignBox(ctx);
      this.drawBanner2(ctx);
      this.drawAbilityBar(ctx);
      this.drawBossBar(ctx);
    }
  }

  drawBody(ctx, cx, cy) {
    // Flash after a respawn: skip every other 0.1 s.
    if (this.flashT > 0 && Math.floor(this.flashT / 0.1) % 2 === 0) return;
    const p = this.player;
    const img = this.images[CHARACTERS[this.active].sprite];
    const sx = Math.round(p.x + p.w / 2 - 24 - cx);
    const sy = Math.round(p.y + p.h - 48 - cy);
    ctx.save();
    // Ghost: the body is drawn faded while the ghost ability lasts.
    if (this.ghostT > 0) ctx.globalAlpha = 0.5;
    if (p.facing < 0) {
      ctx.translate(sx + 48, sy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, 48, 48);
    } else {
      ctx.drawImage(img, sx, sy, 48, 48);
    }
    ctx.restore();
  }

  // Level name for the first 2.5 seconds, fading out over the last 0.5.
  drawBanner2(ctx) {
    if (this.bannerT <= 0) return;
    ctx.globalAlpha = Math.min(1, this.bannerT / 0.5);
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(120, 80, 240, 30);
    ctx.fillStyle = "#e8e4d8";
    ctx.font = "14px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Level " + (World.index + 1) + ": " + World.level.name, Engine.W / 2, 100);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // Health bar for the warlord while it is alive: 8 segments and a label.
  drawBossBar(ctx) {
    const boss = Enemies.list().find((e) => e.kind === "warlord" && !e.dead);
    if (!boss) return;
    const max = ENEMY_DEFS.warlord.hp;
    ctx.font = "10px system-ui, sans-serif";
    ctx.fillStyle = "#e8e4d8";
    ctx.fillText("Warlord", 150, 58);
    for (let i = 0; i < max; i++) {
      ctx.fillStyle = i < boss.hp ? "#c2452d" : "#3a2020";
      ctx.fillRect(210 + i * 14, 50, 12, 10);
    }
  }

  // Strip above the hand HUD: the active character's four abilities on A, S, Z, X.
  drawAbilityBar(ctx) {
    const ids = CHARACTERS[this.active].abilities;
    const keys = ["A", "S", "Z", "X"];
    const text = ids.map((id, i) => keys[i] + " " + ABILITY_NAMES[id]).join("   ");
    ctx.font = "8px system-ui, sans-serif";
    const w = Math.ceil(ctx.measureText(text).width) + 16;
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(Engine.W / 2 - w / 2, 204, w, 14);
    ctx.fillStyle = "#e8e4d8";
    ctx.textAlign = "center";
    ctx.fillText(text, Engine.W / 2, 214);
    ctx.textAlign = "left";
  }

  // Box across the top of the screen with the text of the sign under the player.
  drawSignBox(ctx) {
    if (!this.signText) return;
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(40, 8, 400, 40);
    ctx.fillStyle = "#ffffff";
    ctx.font = "10px system-ui, sans-serif";
    ctx.textAlign = "center";
    const lines = wrapText(ctx, this.signText, 380);
    lines.forEach((line, i) => ctx.fillText(line, Engine.W / 2, 24 + i * 14));
    ctx.textAlign = "left";
  }

  drawBanner(ctx, text) {
    ctx.font = "11px system-ui, sans-serif";
    const w = Math.ceil(ctx.measureText(text).width) + 12;
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.fillRect(8, 8, w, 22);
    ctx.fillStyle = "#e8e4d8";
    ctx.fillText(text, 14, 22);
  }

  drawSelect(ctx) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(0, 0, Engine.W, Engine.H);

    const title = this.reason === "fell" ? "You fell." : this.reason === "discarded" ? "Discarded." : "You were slain.";
    ctx.fillStyle = "#e8e4d8";
    ctx.font = "16px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title, Engine.W / 2, 70);
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillText("Choose a card to become. Left/Right to choose, Z or A to confirm.", Engine.W / 2, 90);
    ctx.textAlign = "left";

    Hand.slots().forEach((cardId, i) => {
      const x = Engine.W / 2 - 1.5 * 124 + i * 124;
      const y = 110;
      ctx.fillStyle = cardId ? CARD_DEFS[cardId].color : "#2a3644";
      ctx.fillRect(x, y, 116, 90);
      ctx.strokeStyle = i === this.sel ? "#d9a441" : "#111418";
      ctx.lineWidth = i === this.sel ? 3 : 1;
      ctx.strokeRect(x + 0.5, y + 0.5, 115, 89);
      ctx.lineWidth = 1;
      if (cardId) {
        ctx.fillStyle = "#111418";
        ctx.font = "13px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(CARD_DEFS[cardId].name, x + 58, y + 50);
        ctx.textAlign = "left";
      }
    });
  }
}

// Bottom HUD: three hand slots and the deck count. Deck contents stay hidden.
const HUD = (() => {
  const SLOT_W = 84;
  const SLOT_H = 34;
  const Y = Engine.H - SLOT_H - 8;

  function slotRect(i) {
    return { x: 8 + i * (SLOT_W + 6), y: Y, w: SLOT_W, h: SLOT_H };
  }

  function deckRect() {
    return { x: 8 + Hand.SLOTS * (SLOT_W + 6) + 10, y: Y, w: 70, h: SLOT_H };
  }

  // highlight is a slot index to outline, or -1 for none.
  function draw(ctx, highlight) {
    ctx.font = "11px system-ui, sans-serif";
    Hand.slots().forEach((cardId, i) => {
      const r = slotRect(i);
      ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
      ctx.fillRect(r.x, r.y, r.w, r.h);
      if (cardId) {
        ctx.fillStyle = CARD_DEFS[cardId].color;
        ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
        ctx.fillStyle = "#111418";
        ctx.fillText(CARD_DEFS[cardId].name, r.x + 8, r.y + 21);
      } else {
        ctx.strokeStyle = "#9fb0c0";
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      }
      if (i === highlight) {
        ctx.strokeStyle = "#d9a441";
        ctx.lineWidth = 2;
        ctx.strokeRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2);
        ctx.lineWidth = 1;
      }
    });

    const d = deckRect();
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = "#e8e4d8";
    ctx.fillText("Deck: " + Hand.deckCount(), d.x + 8, d.y + 21);
  }

  return { slotRect, deckRect, draw };
})();

// ---- main.js ----
// Entry point. Loads every image, then opens the title screen.
const IMG = {};

function loadImages(urls) {
  const jobs = Object.entries(urls).map(
    ([key, src]) =>
      new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          IMG[key] = img;
          resolve();
        };
        img.onerror = () => reject(new Error("failed to load " + key));
        img.src = src;
      })
  );
  return Promise.all(jobs);
}

// A copy of an image with a color laid over its opaque pixels.
function tint(img, rgba) {
  const c = document.createElement("canvas");
  c.width = img.width;
  c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = rgba;
  g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = "source-over";
  return c;
}

loadImages(ASSET_URLS)
  .then(() => {
    IMG.mage = tint(IMG.knight_right, "rgba(120, 70, 200, 0.45)");
    IMG.warlord = tint(IMG.grunt, "rgba(150, 30, 30, 0.45)");
    Engine.start(new TitleScene());
  })
  .catch((err) => {
    document.body.textContent = err.message;
    console.error(err);
  });

</script>
