:root {
  --bg: #111418;
  --ink: #e8e4d8;
  --accent: #d9a441;
  --panel: rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
}

#fullscreen {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 6px 10px;
  font: 13px system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 4px;
  cursor: pointer;
}

#fsNote {
  position: fixed;
  top: 44px;
  right: 8px;
  z-index: 3;
  max-width: 260px;
  padding: 8px 10px;
  font-size: 13px;
  background: var(--panel);
  border-radius: 4px;
}

#fsNote[hidden] { display: none; }

#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 4;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
  background: var(--bg);
  font-size: 18px;
}

body.portrait #rotate { display: flex; }

#touch {
  display: none;
  position: fixed;
  inset: auto 0 0 0;
  z-index: 2;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 12px 12px;
  pointer-events: none;
}

body.touch #touch { display: flex; }

#touch .pad,
#touch .face {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  pointer-events: auto;
}

#touch .face { justify-content: flex-end; max-width: 60vw; }

#touch button {
  width: 52px;
  height: 52px;
  font: 14px system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--accent);
  border-radius: 50%;
  touch-action: none;
}

#touch button.jump { width: 72px; border-radius: 26px; }

#touch button.held { background: var(--accent); color: #111; }

@media (max-width: 900px) and (orientation: landscape) {
  #touch button { width: 44px; height: 44px; }
  #touch button.jump { width: 60px; }
}

</style>
</head>
<body>
<canvas id="screen" width="480" height="270"></canvas>

<button id="fullscreen" type="button" aria-label="Toggle full screen">Full screen</button>
<div id="fsNote" hidden></div>

<div id="rotate">
  <p>Rotate your device to landscape to play.</p>
</div>

<div id="touch" aria-hidden="true">
  <div class="pad">
    <button data-action="left">&#9664;</button>
    <button data-action="right">&#9654;</button>
  </div>
  <div class="face">
    <button data-action="up" class="jump">Jump</button>
    <button data-action="ab1">A</button>
    <button data-action="ab2">S</button>
    <button data-action="ab3">Z</button>
    <button data-action="ab4">X</button>
    <button data-action="discardSelf">Q</button>
    <button data-action="discardCard">C</button>
  </div>
</div>

// ---- engine.js ----
// Fixed-timestep loop, letterboxed canvas scaling, and the scene switch.
const Engine = (() => {
  const W = 480;
  const H = 270;
  const STEP = 1 / 60;

  let canvas = null;
  let ctx = null;
  let scene = null;
  let last = 0;
  let acc = 0;
  // Backing-store scale: whole device pixels per logical pixel, so text and sprites stay sharp.
  let S = 1;

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    S = Math.max(1, Math.min(4, Math.round(scale * (window.devicePixelRatio || 1))));
    canvas.width = W * S;
    canvas.height = H * S;
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
    document.body.classList.toggle("portrait", window.innerHeight > window.innerWidth);
  }

  function frame(t) {
    const dt = Math.min((t - last) / 1000, 0.25);
    last = t;
    // Portrait pauses the game. The overlay asks the player to rotate.
    const paused = document.body.classList.contains("portrait");
    if (!paused) {
      acc += dt;
      while (acc >= STEP) {
        Input.update();
        scene.update(STEP);
        acc -= STEP;
      }
    }
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = false;
    scene.draw(ctx);
    requestAnimationFrame(frame);
  }

  function setScene(next) {
    scene = next;
    if (scene.enter) scene.enter();
  }

  function start(firstScene) {
    canvas = document.getElementById("screen");
    ctx = canvas.getContext("2d");
    window.addEventListener("resize", resize);
    resize();
    setScene(firstScene);
    last = performance.now();
    requestAnimationFrame(frame);
  }

  return { W, H, STEP, start, setScene, resize, current: () => scene, scale: () => S };
})();

// ---- ui.js ----
// Text helper. Every on-screen string goes through drawText: it strokes a dark outline
// first, so text reads on any background. The font and fill style are set on ctx by the caller.
function drawText(ctx, text, x, y) {
  const size = parseInt((ctx.font.match(/(\d+)px/) || [0, "10"])[1], 10);
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, size / 4);
  ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
}

// ---- sfx.js ----
// Sound effects made in code with the Web Audio API. Nothing is loaded from disk.
// If audio is unavailable, play() does nothing from then on.
const Sfx = {
  enabled: true,
  ctx: null,
  broken: false,

  // One oscillator note with a short attack and a fade-out.
  tone(type, f0, f1, start, dur, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, start);
    if (f1) osc.frequency.linearRampToValueAtTime(f1, start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  },

  // Browsers may leave a new AudioContext suspended until the player acts.
  resume() {
    try {
      if (this.ctx && this.ctx.state === "suspended") {
        const r = this.ctx.resume();
        if (r && r.catch) r.catch(() => {});
      }
    } catch (e) {
      // Nothing to do: sound stays quiet until the next gesture.
    }
  },

  play(name) {
    if (!this.enabled || this.broken) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        window.addEventListener("keydown", () => this.resume(), { once: true });
        window.addEventListener("pointerdown", () => this.resume(), { once: true });
      }
      this.resume();
      const t = this.ctx.currentTime;
      switch (name) {
        case "jump":
          this.tone("square", 440, 660, t, 0.1, 0.08);
          break;
        case "hit":
          // A thud under a short crack.
          this.tone("square", 220, null, t, 0.08, 0.1);
          this.tone("triangle", 110, 60, t, 0.12, 0.08);
          break;
        case "pickup":
          this.tone("triangle", 660, null, t, 0.06, 0.1);
          this.tone("triangle", 880, null, t + 0.06, 0.06, 0.1);
          break;
        case "hurt":
          this.tone("sawtooth", 300, 80, t, 0.3, 0.1);
          break;
        case "ability":
          this.tone("triangle", 520, null, t, 0.05, 0.06);
          break;
        case "beam":
          // Charge hum rising into the zap, then a buzzing tail.
          this.tone("sine", 220, 880, t, 0.1, 0.06);
          this.tone("sawtooth", 1400, 300, t + 0.1, 0.12, 0.05);
          this.tone("square", 110, 90, t + 0.1, 0.35, 0.04);
          break;
        case "complete":
          [523, 659, 784, 1047].forEach((f, i) => this.tone("triangle", f, null, t + i * 0.1, 0.1, 0.1));
          break;
        case "boss":
          this.tone("sawtooth", 110, null, t, 0.4, 0.12);
          break;
        default:
          break;
      }
    } catch (e) {
      this.broken = true;
    }
  },
};

// ---- input.js ----
// Logical actions fed by keyboard, gamepad, and on-screen touch buttons.
// Scenes ask for actions by name and never read raw keys or buttons.
const Input = (() => {
  // Keyboard uses letter keys and arrows, matching the design doc.
  const KEYS = {
    ArrowLeft: "left",
    ArrowRight: "right",
    ArrowUp: "up",
    ArrowDown: "down",
    KeyA: "ab1",
    KeyS: "ab2",
    KeyZ: "ab3",
    KeyX: "ab4",
    KeyQ: "discardSelf",
    KeyC: "discardCard",
    Enter: "start",
  };

  // Standard gamepad mapping. Ability order follows the design doc:
  // ab1 is X, ab2 is Y, ab3 is A, ab4 is B.
  const PAD = {
    0: "ab3",
    1: "ab4",
    2: "ab1",
    3: "ab2",
    9: "start",
    12: "up",
    13: "down",
    14: "left",
    15: "right",
  };

  const keyHeld = new Set();
  const touchHeld = new Set();
  // A press that starts and ends between two fixed steps still counts once.
  const latched = new Set();
  let padHeld = new Set();
  let cur = new Set();
  let prev = new Set();
  let edge = new Set();

  window.addEventListener("keydown", (e) => {
    const action = KEYS[e.code];
    if (!action) return;
    e.preventDefault();
    if (!e.repeat) latched.add(action);
    keyHeld.add(action);
  });

  window.addEventListener("keyup", (e) => {
    const action = KEYS[e.code];
    if (action) keyHeld.delete(action);
  });

  // Losing focus must not leave a key stuck down.
  window.addEventListener("blur", () => {
    keyHeld.clear();
    touchHeld.clear();
  });

  function readGamepads() {
    padHeld = new Set();
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const pad of pads) {
      if (!pad) continue;
      pad.buttons.forEach((b, i) => {
        if (PAD[i] && (b.pressed || b.value > 0.5)) padHeld.add(PAD[i]);
      });
      // Left stick works as a bonus on top of the d-pad.
      if (pad.axes[0] < -0.5) padHeld.add("left");
      if (pad.axes[0] > 0.5) padHeld.add("right");
    }
  }

  // Call once per fixed step, before the scene updates.
  function update() {
    readGamepads();
    prev = cur;
    cur = new Set([...keyHeld, ...touchHeld, ...padHeld]);
    edge = new Set([...latched].concat([...cur].filter((a) => !prev.has(a))));
    latched.clear();
  }

  function down(action) {
    return cur.has(action);
  }

  function pressed(action) {
    return edge.has(action);
  }

  function setTouch(action, on) {
    if (on) {
      touchHeld.add(action);
      latched.add(action);
    } else {
      touchHeld.delete(action);
    }
  }

  function bindTouchButtons() {
    const root = document.getElementById("touch");
    const buttons = root.querySelectorAll("button[data-action]");
    const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    if (isTouch) document.body.classList.add("touch");

    for (const btn of buttons) {
      const action = btn.dataset.action;
      const press = (e) => {
        e.preventDefault();
        setTouch(action, true);
        btn.classList.add("held");
      };
      const release = (e) => {
        e.preventDefault();
        setTouch(action, false);
        btn.classList.remove("held");
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", release);
    }
  }

  // Older Safari and Chrome use the webkit-prefixed names, so check both.
  function bindFullscreen() {
    const btn = document.getElementById("fullscreen");
    const note = document.getElementById("fsNote");
    const root = document.documentElement;
    btn.addEventListener("click", () => {
      const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      if (!enabled) {
        note.textContent =
          "Full screen is not available in this browser. On iPhone, use Share, then Add to Home Screen.";
        note.hidden = false;
        return;
      }
      const current = document.fullscreenElement || document.webkitFullscreenElement;
      const fn = current
        ? document.exitFullscreen || document.webkitExitFullscreen
        : root.requestFullscreen || root.webkitRequestFullscreen;
      if (!fn) return;
      const r = current ? fn.call(document) : fn.call(root);
      if (r && r.catch) r.catch(() => {});
    });
  }

  bindTouchButtons();
  bindFullscreen();

  // Drops every held key, touch, and latched press. Used when a new game starts.
  function clearAll() {
    keyHeld.clear();
    touchHeld.clear();
    latched.clear();
  }

  return { update, down, pressed, setTouch, clearAll };
})();

// ---- world.js ----
// Tile map, tile legend, and axis-separated collision.
const TILE = 32;

// Colors per theme. "field" keeps the original outdoor look.
const THEMES = {
  field: { sky: "#7fb6e0", far: "#a8cde8", near: "#6f9fbf" },
  dungeon: { sky: "#17141f", far: "#2a2533", near: "#3a3242" },
};

// Legend:
//   #  solid brick wall
//   =  solid grass ground
//   _  one-way platform (solid only when landing from above)
//   T  tree (decor, no collision)
//   S  player spawn (drawn as empty)
//   g  goblin grunt spawn (drawn as empty)
//   m  mud revenant spawn (drawn as empty)
//   j  rat king spawn (drawn as empty)
//   a  archer spawn (drawn as empty)
//   W  warlord boss spawn (drawn as empty)
//   F  level exit flag (drawn as a pole and flag)
//   c  card pickup on the ground (random character card)
//   k  card pickup on the main route (not a secret)
//   p  power-up on the ground (draws a random card into hand or deck)
//   ^  spikes (not solid; touching them is deadly)
//   i  sign post (decor; shows its text while the player stands at it)
//   x  cracked wall (solid; broken by the knight's shield bash or charge)
//   .  empty air
const World = (() => {
  let index = 0;
  let tiles = [];
  let rows = 0;
  let cols = 0;
  let width = 0;
  let height = 0;
  let spawn = { x: 0, y: 0 };
  let exit = null;
  // The flag is drawn dimmed while a boss keeps it closed.
  let flagOpen = true;
  // Temporary one-way platforms made in play (arrow anchor rope). Each has a life in seconds.
  const platforms = [];
  const enemySpawns = [];
  const pickupSpawns = [];
  const signs = [];
  const MARKERS = { g: "grunt", m: "mud_revenant", j: "rat_king", a: "archer", W: "warlord" };

  // Loads level i from LEVELS. Every system reads the current level through these values.
  function load(i) {
    index = i;
    const level = LEVELS[i];
    tiles = level.rows.map((row) => row.split(""));
    rows = tiles.length;
    cols = tiles[0].length;
    width = cols * TILE;
    height = rows * TILE;
    spawn = { x: 0, y: 0 };
    exit = null;
    platforms.length = 0;
    enemySpawns.length = 0;
    pickupSpawns.length = 0;
    signs.length = 0;
    let signN = 0;
    tiles.forEach((row, ty) =>
      row.forEach((ch, tx) => {
        if (ch === "S") spawn = { x: tx * TILE, y: ty * TILE };
        // The exit zone is 4 tiles tall, reaching 3 tiles above the flag, so a
        // jump that clears the flag's tile still completes the level.
        if (ch === "F") exit = { x: tx * TILE, y: (ty - 3) * TILE, w: TILE, h: 4 * TILE };
        if (MARKERS[ch]) enemySpawns.push({ kind: MARKERS[ch], x: tx * TILE, y: ty * TILE });
        if (ch === "c" || ch === "k" || ch === "p") {
          pickupSpawns.push({ power: ch === "p", secret: ch !== "k", x: tx * TILE, y: ty * TILE });
        }
        if (ch === "i") signs.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE, text: (level.signs || [])[signN++] || "" });
      })
    );
  }

  function setFlagOpen(open) {
    flagOpen = open;
  }

  // Flag pole and pennant on the exit tile.
  function drawFlag(ctx, px, py) {
    ctx.globalAlpha = flagOpen ? 1 : 0.3;
    ctx.fillStyle = "#5b4a3a";
    ctx.fillRect(px + 14, py - 24, 3, 56);
    ctx.fillStyle = "#e0b84a";
    ctx.beginPath();
    ctx.moveTo(px + 17, py - 24);
    ctx.lineTo(px + 30, py - 18);
    ctx.lineTo(px + 17, py - 12);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Sets one tile (used by tests and by the sign and spike code).
  function setTile(tx, ty, ch) {
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
    tiles[ty][tx] = ch;
  }

  function at(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return ".";
    return tiles[ty][tx];
  }

  function isSolid(ch) {
    return ch === "#" || ch === "=" || ch === "x";
  }

  // Breaks every cracked wall the box touches. Returns true if any broke.
  function breakCracked(x, y, w, h) {
    let broke = false;
    for (const c of overlapping(x, y, w, h)) {
      if (c.ch === "x") {
        setTile(c.tx, c.ty, ".");
        broke = true;
      }
    }
    return broke;
  }

  function isOneWay(ch) {
    return ch === "_";
  }

  // True when the point sits on a tile that can hold up a body.
  function isStandable(x, y) {
    const ch = at(Math.floor(x / TILE), Math.floor(y / TILE));
    return isSolid(ch) || isOneWay(ch);
  }

  // Tile cells the box overlaps. Callers pick which kinds they care about.
  function overlapping(x, y, w, h) {
    const x0 = Math.floor(x / TILE);
    const y0 = Math.floor(y / TILE);
    const x1 = Math.floor((x + w - 0.001) / TILE);
    const y1 = Math.floor((y + h - 0.001) / TILE);
    const out = [];
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        out.push({ tx, ty, ch: at(tx, ty) });
      }
    }
    return out;
  }

  // Move body e (x, y, w, h, vx, vy, grounded) by its velocity for one step.
  function moveBody(e, dt) {
    const prevBottom = e.y + e.h;

    // Horizontal first. Walls stop the body on the tile edge.
    e.x += e.vx * dt;
    for (const c of overlapping(e.x, e.y, e.w, e.h)) {
      if (!isSolid(c.ch)) continue;
      if (e.vx > 0) e.x = Math.min(e.x, c.tx * TILE - e.w);
      if (e.vx < 0) e.x = Math.max(e.x, (c.tx + 1) * TILE);
    }
    e.x = Math.max(0, Math.min(e.x, width - e.w));

    // Vertical second. Floors and ceilings stop the body on the tile edge.
    e.grounded = false;
    e.y += e.vy * dt;
    for (const c of overlapping(e.x, e.y, e.w, e.h)) {
      if (isSolid(c.ch)) {
        if (e.vy > 0) {
          e.y = c.ty * TILE - e.h;
          e.vy = 0;
          e.grounded = true;
        } else if (e.vy < 0) {
          e.y = (c.ty + 1) * TILE;
          e.vy = 0;
        }
      } else if (isOneWay(c.ch) && e.vy >= 0 && prevBottom <= c.ty * TILE + 0.5) {
        e.y = c.ty * TILE - e.h;
        e.vy = 0;
        e.grounded = true;
      }
    }
    for (const pl of platforms) {
      const overlapX = e.x + e.w > pl.x && e.x < pl.x + pl.w;
      if (overlapX && e.vy >= 0 && prevBottom <= pl.y + 0.5 && e.y + e.h >= pl.y) {
        e.y = pl.y - e.h;
        e.vy = 0;
        e.grounded = true;
      }
    }
  }

  function addPlatform(pl) {
    platforms.push(pl);
  }

  function updatePlatforms(dt) {
    for (let i = platforms.length - 1; i >= 0; i--) {
      platforms[i].life -= dt;
      if (platforms[i].life <= 0) platforms.splice(i, 1);
    }
  }

  // Only the drawing changes; collision stays a flat platform.
  function drawPlatforms(ctx, camX, camY) {
    for (const pl of platforms) {
      const x = Math.round(pl.x - camX);
      const y = Math.round(pl.y - camY);
      if (pl.color) {
        // Bone bridge: alternating 6 px segments with a dark outline.
        for (let sx = 0; sx < pl.w; sx += 6) {
          const w = Math.min(6, pl.w - sx);
          ctx.fillStyle = (sx / 6) % 2 === 0 ? pl.color : "#c8c0a8";
          ctx.fillRect(x + sx, y, w, 3);
          ctx.fillStyle = "#3a3020";
          ctx.fillRect(x + sx, y + 3, w, 1);
        }
      } else {
        // Rope: three segments, the middle one sagging 2 px.
        const third = Math.floor(pl.w / 3);
        ctx.fillStyle = "#7a5230";
        ctx.fillRect(x, y, third, 3);
        ctx.fillRect(x + third, y + 2, pl.w - 2 * third, 3);
        ctx.fillRect(x + pl.w - third, y, third, 3);
      }
      ctx.fillStyle = pl.color || "#7a5230";
      ctx.fillRect(x, y, 3, pl.h + 6);
      ctx.fillRect(x + pl.w - 3, y, 3, pl.h + 6);
    }
  }

  // Closest safe spot to (x, y) for a body of size w by h. A safe spot is a
  // standable tile with a clear 2 by 3 tile area above it, and no enemy
  // within 3 tiles. Searches up to 20 tiles out. Falls back to the spawn.
  function closestSafeSpace(x, y, w, h, enemies) {
    const cx = Math.min(cols - 1, Math.max(0, Math.floor((x + w / 2) / TILE)));
    const cy = Math.min(rows - 1, Math.max(0, Math.floor((y + h) / TILE)));
    const free = (ch) => !isSolid(ch) && !isOneWay(ch);
    let best = null;
    let bestDist = Infinity;

    for (let ty = cy - 20; ty <= cy + 20; ty++) {
      for (let tx = cx - 20; tx <= cx + 20; tx++) {
        const ground = at(tx, ty);
        if (!(isSolid(ground) || isOneWay(ground))) continue;
        let clear = true;
        for (let dy = 1; dy <= 3 && clear; dy++) {
          for (let dx = 0; dx <= 1 && clear; dx++) {
            clear = free(at(tx + dx, ty - dy));
          }
        }
        if (!clear) continue;
        // A spot is not safe if spikes lie within 3 columns on the body's row.
        let spiky = false;
        for (let dx = -3; dx <= 3; dx++) if (at(tx + dx, ty - 1) === "^") spiky = true;
        if (spiky) continue;

        const sx = tx * TILE + (TILE - w) / 2;
        const sy = ty * TILE - h;
        const near = enemies.some(
          (e) =>
            !e.dead &&
            Math.hypot(sx + w / 2 - (e.x + e.w / 2), sy + h / 2 - (e.y + e.h / 2)) < 3 * TILE
        );
        if (near) continue;

        const dist = Math.hypot(sx - x, sy - y);
        if (dist < bestDist) {
          bestDist = dist;
          best = { x: sx, y: sy };
        }
      }
    }
    return best || { x: spawn.x, y: spawn.y };
  }

  // A wall tile with dark zigzag cracks across it.
  function drawCracked(ctx, wallImg, px, py) {
    ctx.drawImage(wallImg, px, py, TILE, TILE);
    ctx.strokeStyle = "#2a1d14";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 2, py + 4);
    ctx.lineTo(px + 12, py + 12);
    ctx.lineTo(px + 8, py + 20);
    ctx.lineTo(px + 22, py + 28);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // Sign posts from World.signs: a brown stick with a board on top.
  function drawSigns(ctx, camX, camY) {
    for (const sg of signs) {
      const px = Math.round(sg.x - camX);
      const py = Math.round(sg.y - camY);
      ctx.fillStyle = "#7a5230";
      ctx.fillRect(px + 14, py + 16, 4, 16);
      ctx.fillStyle = "#a87a4a";
      ctx.fillRect(px + 6, py + 4, 20, 12);
    }
  }

  // Three grey spikes standing on the bottom edge of the tile.
  function drawSpikes(ctx, px, py) {
    ctx.fillStyle = "#9aa0a8";
    ctx.strokeStyle = "#5b6068";
    for (let i = 0; i < 3; i++) {
      const x0 = px + 1 + i * 10;
      const base = py + TILE;
      ctx.beginPath();
      ctx.moveTo(x0, base);
      ctx.lineTo(x0 + 5, base - 12);
      ctx.lineTo(x0 + 10, base);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function draw(ctx, images, camX, camY, viewW, viewH) {
    const tx0 = Math.max(0, Math.floor(camX / TILE));
    const ty0 = Math.max(0, Math.floor(camY / TILE));
    const tx1 = Math.min(cols - 1, Math.floor((camX + viewW) / TILE));
    const ty1 = Math.min(rows - 1, Math.floor((camY + viewH) / TILE));

    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const ch = at(tx, ty);
        const px = Math.round(tx * TILE - camX);
        const py = Math.round(ty * TILE - camY);
        if (ch === "#") ctx.drawImage(images.wall, px, py, TILE, TILE);
        else if (ch === "x") drawCracked(ctx, images.wall, px, py);
        else if (ch === "=" && LEVELS[index].theme === "dungeon") {
          // Dungeon ground is bare dirt, shaded darker.
          ctx.drawImage(images.dirt, px, py, TILE, TILE);
          ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
          ctx.fillRect(px, py, TILE, TILE);
          // A light top edge makes ledges readable against the dark sky.
          if (!isSolid(ty > 0 ? at(tx, ty - 1) : ".")) {
            ctx.fillStyle = "#9c8fb0";
            ctx.fillRect(px, py, TILE, 3);
          }
        } else if (ch === "=") {
          ctx.drawImage(images.dirt, px, py, TILE, TILE);
          ctx.drawImage(images.grass, px, py, TILE, TILE);
        } else if (ch === "_") {
          ctx.drawImage(images.grass, px, py, TILE, TILE);
        } else if (ch === "T" && LEVELS[index].theme !== "dungeon") {
          ctx.drawImage(images.tree, px, py, TILE, TILE);
        } else if (ch === "^") {
          drawSpikes(ctx, px, py);
        } else if (ch === "F") {
          drawFlag(ctx, px, py);
        }
      }
    }
  }

  const api = {
    TILE,
    get width() { return width; },
    get height() { return height; },
    get cols() { return cols; },
    get rows() { return rows; },
    get spawn() { return spawn; },
    get enemySpawns() { return enemySpawns; },
    get pickupSpawns() { return pickupSpawns; },
    get index() { return index; },
    get level() { return LEVELS[index]; },
    count: LEVELS.length,
    signs,
    exit: () => exit,
    at,
    setTile,
    isSolid,
    isStandable,
    breakCracked,
    moveBody,
    closestSafeSpace,
    addPlatform,
    updatePlatforms,
    drawPlatforms,
    platforms,
    draw,
    drawSigns,
    setFlagOpen,
    // Secrets (c and p markers) in level i.
    countSecrets: (i) => LEVELS[i].rows.reduce((n, row) => n + [...row].filter((ch) => ch === "c" || ch === "p").length, 0),
    THEMES,
    overlapping,
    load,
  };
  load(0);
  return api;
})();

// ---- cards.js ----
// Character cards, the 3-slot hand, and the deck.
const CARD_DEFS = {
  knight: { name: "Knight", color: "#8fa6c0" },
  ranger: { name: "Ranger", color: "#6f9c5a" },
  mage: { name: "Mage", color: "#9b7fd1" },
  rat: { name: "Rat", color: "#a0826d" },
  weaver: { name: "Bone Weaver", color: "#d8d2c0" },
};

// Hand fills left to right. Extra cards go into the deck at a random spot.
// Deck contents stay hidden; the HUD only shows the count.
// When a hand slot opens, the top card of the deck moves into it.
const Hand = (() => {
  const SLOTS = 3;
  const hand = new Array(SLOTS).fill(null);
  const deck = [];

  function refill() {
    for (let i = 0; i < SLOTS; i++) {
      if (hand[i] === null && deck.length > 0) hand[i] = deck.shift();
    }
  }

  // Returns where the card landed so the HUD can animate to it.
  function collect(cardId) {
    const free = hand.indexOf(null);
    if (free !== -1) {
      hand[free] = cardId;
      return { where: "hand", slot: free };
    }
    const at = Math.floor(Math.random() * (deck.length + 1));
    deck.splice(at, 0, cardId);
    return { where: "deck" };
  }

  function discard(slot) {
    const cardId = hand[slot];
    hand[slot] = null;
    refill();
    return cardId;
  }

  // Empties the hand and the deck. Called when a new game starts.
  function reset() {
    hand.fill(null);
    deck.length = 0;
  }

  // Plain data for the save file, and back again.
  function serialize() {
    return { hand: hand.slice(), deck: deck.slice() };
  }

  function restore(data) {
    for (let i = 0; i < SLOTS; i++) hand[i] = data.hand[i] || null;
    deck.length = 0;
    deck.push(...data.deck);
  }

  return {
    SLOTS,
    collect,
    discard,
    reset,
    serialize,
    restore,
    get: (slot) => hand[slot],
    slots: () => hand.slice(),
    deckCount: () => deck.length,
  };
})();

// ---- glow.js ----
// Banded pixel glow, after the wizard beam method: every effect is a smooth
// energy value cut into a few flat colour bands (white core, pale, mid, deep,
// faint halo), so soft maths still reads as crisp pixel art. Light on the
// scene is drawn through a 4 by 4 ordered dither pattern.
const Glow = (() => {
  // Ramps run core to edge. Five colours each.
  const RAMPS = {
    arcane: ["#ffffff", "#f0e6ff", "#d9c8ff", "#b9a2f0", "#7a5cc8"],
    steel: ["#ffffff", "#e6f2ff", "#b4dcff", "#7fb2ff", "#4a78d8"],
    ember: ["#ffffff", "#fff4c0", "#ffd166", "#ff9a3c", "#c2452d"],
    bone: ["#ffffff", "#effbe8", "#cdeec0", "#9fd39a", "#5a9a6a"],
  };
  // Energy thresholds for the bands, highest first.
  const BANDS = [0.92, 0.8, 0.66, 0.5, 0.3];
  const PROFILE = 1.08;

  // Distance from the axis where a beam of half width w falls to each band.
  // Profile: 1.08 * (1 - (d / (w + 2.5)) ^ 1.6).
  function bandWidths(w) {
    return BANDS.map((th) => (w + 2.5) * Math.pow(1 - th / PROFILE, 1 / 1.6));
  }

  // Seeded random, so one step's jitter draws the same way every frame of that step.
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => {
      s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
      return ((s >>> 0) % 10000) / 10000;
    };
  }

  // A filled disc in bands. r is the outer (deep) band radius.
  function disc(ctx, x, y, r, ramp, alpha = 1) {
    const c = RAMPS[ramp] || ramp;
    const bw = bandWidths(r - 2.5);
    x = Math.round(x); y = Math.round(y);
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = c[3];
    ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha;
    for (let i = 4; i >= 0; i--) {
      if (bw[i] < 0.6) continue;
      ctx.fillStyle = c[i];
      ctx.beginPath(); ctx.arc(x, y, bw[i], 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Four-ray star. Turns 45 degrees on odd phases so it flickers.
  function star(ctx, x, y, r, phase, ramp, alpha = 1) {
    const c = RAMPS[ramp] || ramp;
    x = Math.round(x); y = Math.round(y);
    const diag = phase % 2 === 1;
    ctx.globalAlpha = alpha;
    for (let k = 1; k <= r; k++) {
      ctx.fillStyle = k < r * 0.5 ? c[1] : c[3];
      if (diag) {
        ctx.fillRect(x + k, y + k, 1, 1); ctx.fillRect(x - k, y + k, 1, 1);
        ctx.fillRect(x + k, y - k, 1, 1); ctx.fillRect(x - k, y - k, 1, 1);
      } else {
        ctx.fillRect(x + k, y, 1, 1); ctx.fillRect(x - k, y, 1, 1);
        ctx.fillRect(x, y + k, 1, 1); ctx.fillRect(x, y - k, 1, 1);
      }
    }
    ctx.fillStyle = c[0];
    ctx.fillRect(x, y, 1, 1);
    ctx.globalAlpha = 1;
  }

  // Lightning by midpoint displacement: 1 px core and a 1 px glow cross.
  function bolt(ctx, x0, y0, x1, y1, ramp, rand, amp = 6, levels = 3) {
    const c = RAMPS[ramp] || ramp;
    let pts = [[x0, y0], [x1, y1]];
    for (let l = 0; l < levels; l++) {
      const next = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1];
        const [bx, by] = pts[i];
        next.push([(ax + bx) / 2 + (rand() - 0.5) * amp * 0.4, (ay + by) / 2 + (rand() - 0.5) * amp], pts[i]);
      }
      pts = next;
      amp /= 2;
    }
    for (let pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? c[3] : c[1];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1];
        const [bx, by] = pts[i];
        const n = Math.max(1, Math.round(Math.max(Math.abs(bx - ax), Math.abs(by - ay))));
        for (let s = 0; s <= n; s++) {
          const px = Math.round(ax + ((bx - ax) * s) / n);
          const py = Math.round(ay + ((by - ay) * s) / n);
          if (pass === 0) { ctx.fillRect(px - 1, py, 3, 1); ctx.fillRect(px, py - 1, 1, 3); }
          else ctx.fillRect(px, py, 1, 1);
        }
      }
    }
    return pts;
  }

  // Ordered dither patterns, one per light level (1 to 4 of 4).
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const patterns = {};
  function pattern(ctx, color, level) {
    const key = color + level;
    if (patterns[key]) return patterns[key];
    const cv = document.createElement("canvas");
    cv.width = 4; cv.height = 4;
    const g = cv.getContext("2d");
    g.fillStyle = color;
    for (let i = 0; i < 16; i++) if (BAYER[i] < level * 4) g.fillRect(i % 4, i >> 2, 1, 1);
    patterns[key] = ctx.createPattern(cv, "repeat");
    return patterns[key];
  }

  // A pool of light on the scene: three dithered rings, denser near the middle.
  function light(ctx, x, y, r, color, strength = 0.35) {
    if (r < 2) return;
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = strength;
    for (let k = 3; k >= 1; k--) {
      ctx.fillStyle = pattern(ctx, color, k);
      ctx.beginPath(); ctx.arc(Math.round(x), Math.round(y), (r * (4 - k)) / 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = prev;
  }

  return { RAMPS, bandWidths, rng, disc, star, bolt, light };
})();

//

  },

    speed: 35,
    chaseSpeed: 60,

  },

class Enemy {
  constructor(kind, x, y) {
    const def = ENEMY_DEFS[kind];
    this.kind = kind;
    this.def = def;
    this.x = x;
    this.y = y;
    this.w = def.w;
    this.h = def.h;
    this.vx = 0;
    this.vy = 0;
    this.grounded = false;
    this.dir = -1;
    this.dead = false;
    this.stunT = 0;
    this.knockT = 0;
    this.knockVx = 0;
    this.jumpT = def.jumpEvery || 0;
    this.fireT = def.fireEvery || 0;
    this.hp = def.hp || 1;
    this.hurtT = 0;
    this.animT = 0;
  }

  // Jump on a timer while the enemy is on the ground and the player is near.
  tryJump(dt, chasing) {
    const d = this.def;
    this.jumpT -= dt;
    if (this.grounded && chasing && this.jumpT <= 0) {
      this.vy = d.jumpVy;
      this.jumpT = d.jumpEvery;
    }
  }

  // Fire a hostile arrow on a timer while the player is lined up.
  tryFire(dt, chasing, dx) {
    const d = this.def;
    this.fireT -= dt;
    if (chasing && this.fireT <= 0) {
      this.dir = dx >= 0 ? 1 : -1;
      Attacks.fireHostile(this.x + this.w / 2, this.y + 12, this.dir);
      this.fireT = d.fireEvery;
    }
  }

  update(dt, player) {
    // Animation clock for the walk, idle, and hurt frames. Draw only reads it.
    this.animT += dt;
    const d = this.def;
    const dx = player.x + player.w / 2 - (this.x + this.w / 2);
    const dy = player.y + player.h / 2 - (this.y + this.h / 2);
    const chasing = Math.abs(dx) < d.sight && Math.abs(dy) < 64;
    if (this.hurtT > 0) this.hurtT -= dt;

    if (this.stunT > 0) {
      // Stunned by shield bash: no walking or chasing, gravity still applies.
      this.stunT -= dt;
      this.vx = 0;
      this.vy = Math.min(this.vy + 900 * dt, 600);
      World.moveBody(this, dt);
      return;
    }
    if (this.knockT > 0) {
      // Knocked back by a hit: slide away, no walking or chasing.
      this.knockT -= dt;
      this.vx = this.knockVx;
      World.moveBody(this, dt);
      return;
    }

    if (d.jumpVy) this.tryJump(dt, chasing);
    if (d.fireEvery) this.tryFire(dt, chasing, dx);

    if (chasing) {
      this.dir = dx >= 0 ? 1 : -1;
      this.vx = this.dir * d.chaseSpeed;
    } else {
      // Patrol: turn around at walls and at ledges.
      this.vx = this.dir * d.speed;
    }

    const before = this.x;
    this.vy = Math.min(this.vy + 900 * dt, 600);
    World.moveBody(this, dt);

    if (!chasing) {
      const blocked = this.grounded && Math.abs(this.x - before) < 0.01;
      const aheadX = this.dir > 0 ? this.x + this.w + 2 : this.x - 2;
      const footY = this.y + this.h + 2;
      const groundAhead = World.isStandable(aheadX, footY);
      if (blocked || !groundAhead) this.dir = -this.dir;
    }
  }

  draw(ctx, images, camX, camY) {
    const dw = this.def.drawW || 64;
    const dh = this.def.drawH || 64;
    const sx = Math.round(this.x + this.w / 2 - dw / 2 - camX);
    const sy = Math.round(this.y + this.h - dh - camY);
    // Hurt: the hurt row, a white silhouette. Archers stand and idle. Others walk.
    let frame;
    if (this.hurtT > 0) frame = { row: ANIM_ROWS.hurt[0], col: 0 };
    else if (this.def.idle) frame = { row: ANIM_ROWS.idle[0], col: Math.floor(this.animT * 3) % ANIM_ROWS.idle[1] };
    else frame = { row: ANIM_ROWS.walk[0], col: Math.floor(this.animT * 6) % ANIM_ROWS.walk[1] };
    const sheet = IMG["lpc_" + this.kind];
    ctx.save();
    if (this.dir < 0) {
      ctx.translate(sx + dw, sy);
      ctx.scale(-1, 1);
      ctx.drawImage(sheet, frame.col * 64, frame.row * 64, 64, 64, 0, 0, dw, dh);
    } else {
      ctx.drawImage(sheet, frame.col * 64, frame.row * 64, 64, 64, sx, sy, dw, dh);
    }
    ctx.restore();
  }
}

// A card on the ground. Falls with gravity until the player touches it.
// cardId is a character id, or "random" to pick one when it is collected.
// A power-up is a gold pickup. It draws one card and then one more.
class CardPickup {
  constructor(cardId, x, y, { power = false, pop = true, secret = false } = {}) {
    this.cardId = cardId;
    this.power = power;
    this.secret = secret;
    this.x = x;
    this.y = y;
    this.w = 14;
    this.h = 18;
    this.vx = 0;
    this.vy = pop ? -120 : 0;
    this.grounded = false;
    this.state = "ground"; // ground, flying, done
    this.t = 0;
  }

  update(dt) {
    if (this.state !== "ground") return;
    this.vy = Math.min(this.vy + 900 * dt, 600);
    World.moveBody(this, dt);
  }

  draw(ctx, camX, camY, flyTo) {
    let sx;
    let sy;
    if (this.state === "flying") {
      const k = 1 - Math.pow(1 - Math.min(this.t / 0.3, 1), 3);
      sx = this.screenFrom.x + (flyTo.x - this.screenFrom.x) * k;
      sy = this.screenFrom.y + (flyTo.y - this.screenFrom.y) * k;
    } else {
      sx = this.x - camX;
      sy = this.y - camY;
    }
    // Unrolled cards (cardId "random") are drawn grey until they are collected.
    const def = this.power ? { color: "#e0b84a" } : CARD_DEFS[this.cardId] || { color: "#b8b8b8" };
    ctx.fillStyle = def.color;
    ctx.fillRect(Math.round(sx), Math.round(sy), this.w, this.h);
    ctx.strokeStyle = "#111418";
    ctx.strokeRect(Math.round(sx) + 0.5, Math.round(sy) + 0.5, this.w - 1, this.h - 1);
  }
}

// Visual effects: defeat bursts and a short screen shake. Drawn in code.
const Effects = {
  shakeT: 0,
  // Shake offset for this step, set in update so draw only reads it.
  shakeX: 0,
  shakeY: 0,
  shakeAmp: 3,
  // White screen flash time left (beam fire).
  flashT: 0,
  bursts: [],
  // Short effects: sparks (hit points), dust squares, and rings. All move in update, never in draw.
  sparks: [],
  dusts: [],
  rings: [],
  // Hot particles with a 1 px trail, and muzzle flares.
  bits: [],
  flares: [],
  reset() {
    this.shakeT = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.bursts.length = 0;
    this.sparks.length = 0;
    this.dusts.length = 0;
    this.rings.length = 0;
    this.bits.length = 0;
    this.flares.length = 0;
    this.flashT = 0;
  },
  // Shake for t seconds, up to amp px. A stronger shake is never cut short by a weaker one.
  shake(t, amp) {
    if (this.shakeT > 0 && this.shakeAmp > amp) return;
    this.shakeT = Math.max(this.shakeT, t);
    this.shakeAmp = amp;
  },
  flash(t) {
    this.flashT = Math.max(this.flashT, t);
  },
  // n hot bits thrown toward dir (1 right, -1 left), in a ramp from Glow.RAMPS.
  spray(x, y, dir, ramp = "ember", n = 4) {
    for (let i = 0; i < n; i++) {
      const a = (Math.random() - 0.5) * 1.6;
      const v = 80 + Math.random() * 90;
      this.bits.push({ x, y, px: x, py: y, vx: dir * Math.cos(a) * v, vy: Math.sin(a) * v - 60, ramp, t: 0, life: 0.25 + Math.random() * 0.15 });
    }
  },
  // A four-ray glint at a bow or staff on release.
  flare(x, y, ramp = "steel") {
    this.flares.push({ x, y, ramp, t: 0 });
  },
  // Impact: a banded flash, six jagged rays for 0.12 s, hot bits thrown back
  // toward the attacker (dir is the attack direction), and a small shake.
  spark(x, y, dir = 0, ramp = "ember") {
    this.sparks.push({ x, y, t: 0, ramp, seed: (Math.random() * 1e9) | 0 });
    if (dir) this.spray(x, y, -dir, ramp, 4);
    this.shake(0.06, 1);
  },
  // n small squares. vy is the starting upward speed (negative rises). Lives for life seconds.
  dust(x, y, color, n, size = 2, life = 0.25, vy = 0) {
    for (let i = 0; i < n; i++) {
      const vx = (i - (n - 1) / 2) * 20;
      this.dusts.push({ x, y, vx, vy: vy - 20 * (i % 2), size, color, life, t: 0 });
    }
  },
  // A circle outline growing from radius 6 to 16 over 0.2 s.
  ring(x, y, color) {
    this.rings.push({ x, y, color, t: 0 });
  },
  burst(x, y, color) {
    const parts = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      parts.push({ x, y, vx: Math.cos(a) * 60, vy: -80 + Math.sin(a) * 30 });
    }
    this.bursts.push({ parts, color, t: 0 });
  },
  update(dt) {
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      this.shakeX = Math.round((Math.random() * 2 - 1) * this.shakeAmp);
      this.shakeY = Math.round((Math.random() * 2 - 1) * this.shakeAmp);
    } else {
      this.shakeX = 0;
      this.shakeY = 0;
    }
    for (const b of this.bursts) {
      b.t += dt;
      for (const q of b.parts) {
        q.vy += 400 * dt;
        q.x += q.vx * dt;
        q.y += q.vy * dt;
      }
    }
    this.bursts = this.bursts.filter((b) => b.t < 0.4);
    for (const s of this.sparks) s.t += dt;
    this.sparks = this.sparks.filter((s) => s.t < 0.12);
    for (const q of this.dusts) {
      q.t += dt;
      q.vy += 300 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
    this.dusts = this.dusts.filter((q) => q.t < q.life);
    for (const r of this.rings) r.t += dt;
    this.rings = this.rings.filter((r) => r.t < 0.2);
    if (this.flashT > 0) this.flashT -= dt;
    for (const q of this.bits) {
      q.t += dt;
      q.px = q.x; q.py = q.y;
      q.vy += 400 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
    this.bits = this.bits.filter((q) => q.t < q.life);
    for (const f of this.flares) f.t += dt;
    this.flares = this.flares.filter((f) => f.t < 0.1);
  },
  draw(ctx, camX, camY) {
    for (const b of this.bursts) {
      ctx.globalAlpha = 1 - b.t / 0.4;
      ctx.fillStyle = b.color;
      for (const q of b.parts) ctx.fillRect(Math.round(q.x - camX), Math.round(q.y - camY), 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const s of this.sparks) {
      const cx = s.x - camX;
      const cy = s.y - camY;
      const k = s.t / 0.12;
      if (k < 0.5) {
        Glow.light(ctx, cx, cy, 14, Glow.RAMPS[s.ramp][3], 0.3);
        Glow.disc(ctx, cx, cy, 6 - k * 6, s.ramp);
      }
      const rand = Glow.rng(s.seed);
      ctx.globalAlpha = 1 - k;
      for (let r = 0; r < 6; r++) {
        const a = (r * Math.PI) / 3 + (rand() - 0.5) * 0.5;
        const len = 4 + k * 3 + rand() * 2;
        const x0 = cx + Math.cos(a) * 2;
        const y0 = cy + Math.sin(a) * 2;
        Glow.bolt(ctx, x0, y0, cx + Math.cos(a) * (2 + len), cy + Math.sin(a) * (2 + len), s.ramp, rand, 2, 1);
      }
      ctx.globalAlpha = 1;
    }
    for (const q of this.bits) {
      const c = Glow.RAMPS[q.ramp];
      const young = q.t < q.life * 0.4;
      ctx.globalAlpha = 1 - q.t / q.life;
      if (young) {
        ctx.fillStyle = c[3];
        ctx.fillRect(Math.round(q.px - camX), Math.round(q.py - camY), 1, 1);
      }
      ctx.fillStyle = young ? c[0] : c[2];
      ctx.fillRect(Math.round(q.x - camX), Math.round(q.y - camY), 1, 1);
    }
    ctx.globalAlpha = 1;
    for (const f of this.flares) {
      Glow.disc(ctx, f.x - camX, f.y - camY, 3, f.ramp, 1 - f.t / 0.1);
      Glow.star(ctx, f.x - camX, f.y - camY, 5, Math.floor(f.t * 60), f.ramp, 1 - f.t / 0.1);
    }
    for (const q of this.dusts) {
      ctx.globalAlpha = 1 - q.t / q.life;
      ctx.fillStyle = q.color;
      ctx.fillRect(Math.round(q.x - camX), Math.round(q.y - camY), q.size, q.size);
    }
    for (const r of this.rings) {
      ctx.globalAlpha = 1 - r.t / 0.2;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(Math.round(r.x - camX), Math.round(r.y - camY), 6 + (r.t / 0.2) * 10, 0, Math.PI * 2);
      ctx.stroke();
      Glow.light(ctx, r.x - camX, r.y - camY, 20, r.color, 0.25 * (1 - r.t / 0.2));
    }
    ctx.globalAlpha = 1;
    if (this.flashT > 0) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
      ctx.fillRect(-4, -4, Engine.W + 8, Engine.H + 8);
    }
  },
};

// Places enemies and card pickups for one level, and runs their updates.
const Enemies = (() => {
  let list = [];
  let pickups = [];

  function spawnFromLevel() {
    list = World.enemySpawns.map((s) => new Enemy(s.kind, s.x, s.y));
    pickups = World.pickupSpawns.map(
      (s) => new CardPickup("random", s.x, s.y, { power: s.power, pop: false, secret: s.secret })
    );
  }

  function dropCard(enemy) {
    const cardId = ENEMY_DEFS[enemy.kind].card;
    pickups.push(new CardPickup(cardId, enemy.x + enemy.w / 2 - 7, enemy.y));
  }

  // Removes an enemy and drops its card. Used by stomps, melee, and arrows.
  // A hit. Enemies with more than 1 hp survive and flash for 0.6 s.
  // fromX is the attacker's x. A surviving enemy is pushed away from it.
  function defeat(enemy, fromX) {
    if (enemy.dead || enemy.hurtT > 0) return;
    if (enemy.hp > 1) {
      enemy.hp -= 1;
      enemy.hurtT = 0.6;
      if (fromX !== undefined) {
        enemy.knockT = 0.12;
        enemy.knockVx = enemy.x + enemy.w / 2 >= fromX ? 160 : -160;
      }
      Sfx.play(enemy.kind === "warlord" ? "boss" : "hit");
      if (enemy.kind === "warlord") { Effects.shake(0.15, 3); Effects.flash(0.04); }
      return;
    }
    enemy.dead = true;
    Sfx.play("hit");
    Effects.burst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, CARD_DEFS[ENEMY_DEFS[enemy.kind].card].color);
    dropCard(enemy);
  }

  return {
    spawnFromLevel,
    dropCard,
    defeat,
    list: () => list,
    pickups: () => pickups,
    cleanup: () => {
      list = list.filter((e) => !e.dead);
      pickups = pickups.filter((p) => p.state !== "done");
    },
  };
})();

// ---- abilities.js ----
// Character data and the ability effects.
//
// Each character has four abilities, bound in order to A/S/Z/X on the
// keyboard and X/Y/A/B on a gamepad (ability 1 to 4).
const CHARACTERS = {
  knight: {
    name: "Knight",
    sprite: "knight",
    abilities: ["shield_bash", "charge", "slash", "thrust"],
  },
  ranger: {
    name: "Ranger",
    sprite: "ranger_right",
    abilities: ["shoot", "arrow_anchor", "slash", "hop"],
  },
  // Ability ids here are defined in C2 and C3. Until then they do nothing.
  rat: {
    name: "Rat",
    sprite: "rat_king",
    abilities: ["leap", "scurry", "slash", "thrust"],
  },
  weaver: {
    name: "Bone Weaver",
    sprite: "bone_weaver",
    abilities: ["shoot", "bone_bridge", "slash", "ghost"],
  },
  // Mage art is the Knight sprite tinted purple (see main.js).
  mage: {
    name: "Mage",
    sprite: "mage_right",
    abilities: ["spell_bolt", "float", "slash", "blink"],
  },
};

const ABILITY_NAMES = {
  shield_bash: "Shield bash",
  charge: "Charge",
  slash: "Slash",
  thrust: "Thrust",
  shoot: "Shoot",
  arrow_anchor: "Arrow anchor",
  hop: "Hop",
  spell_bolt: "Beam",
  float: "Float",
  blink: "Blink",
  leap: "Leap",
  scurry: "Scurry",
  bone_bridge: "Bone bridge",
  ghost: "Ghost",
};

// Attacks in flight: melee hitboxes, projectiles, and rope platforms.
// The scene calls update and draw. Effects that touch enemies go through
// Enemies.defeat and stun.
const Attacks = (() => {
  const hitboxes = [];
  const projectiles = [];
  // Enemy arrows. They fly until they hit a wall or the player.
  const hostile = [];
  const MAX_PROJECTILES = 2;
  // Mage beam (spell_bolt). One at a time. Phases in seconds: charge, fire, sustain, fade.
  let beam = null;
  const BEAM = { charge: 0.1, grow: 1400, range: 224, end: 0.42, fade: 0.14, half: 4 };
  // Set when an attack hits an enemy this step. The scene reads and clears it (hit stop).
  let hitThisStep = false;
  // Seconds before each ability can fire again.
  const COOLDOWN = {
    slash: 0.18, thrust: 0.28, shield_bash: 0.45, charge: 0.6, shoot: 0.25, spell_bolt: 0.5,
    arrow_anchor: 0.8, bone_bridge: 1.0, hop: 0, float: 0, blink: 0.4, leap: 0, scurry: 3.0, ghost: 4.0,
  };

  function faceRect(p, reach, h, dy) {
    const x = p.facing > 0 ? p.x + p.w : p.x - reach;
    return { x, y: p.y + dy, w: reach, h };
  }

  // Drawing data for a melee hitbox: the body's shoulder point and facing.
  function fx(p) {
    return { dir: p.facing, ox: p.x + p.w / 2, oy: p.y + 10 };
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Fires one ability for the scene's player. Timed effects (charge, float)
  // are stored on the scene and read in its update.
  function use(id, scene) {
    const p = scene.player;
    Sfx.play(id === "spell_bolt" ? "beam" : "ability");
    switch (id) {
      case "slash":
        hitboxes.push({ ...faceRect(p, 36, 24, 4), ...fx(p), t: 0.15, total: 0.15, kind: "slash" });
        break;
      case "thrust":
        hitboxes.push({ ...faceRect(p, 56, 12, 10), ...fx(p), t: 0.15, total: 0.15, kind: "thrust" });
        break;
      case "shield_bash":
        hitboxes.push({ ...faceRect(p, 22, 30, 0), ...fx(p), t: 0.12, total: 0.12, kind: "bash", stun: 1.2 });
        break;
      case "charge":
        scene.dashT = 0.25;
        break;
      case "spell_bolt":
        if (!beam) beam = { body: p, dir: p.facing, t: 0, len: 0, hitWall: false, hit: new Set(), seed: 1, motes: [] };
        break;
      case "shoot": {
        Effects.flare(p.facing > 0 ? p.x + p.w + 2 : p.x - 2, p.y + 13, scene.active === "weaver" ? "bone" : "steel");
        const live = projectiles.filter((q) => q.owner === scene.active).length;
        if (live >= MAX_PROJECTILES) break;
        projectiles.push({
          x: p.facing > 0 ? p.x + p.w : p.x - 8,
          y: p.y + 12,
          w: 8,
          h: 4,
          vx: p.facing * 380,
          life: 1.2,
          owner: scene.active,
          kind: id,
        });
        break;
      }
      case "arrow_anchor": {
        // Rope platform three tiles long, one tile in front, two tiles above the feet.
        const x = p.facing > 0 ? p.x + p.w + 4 : p.x - 4 - 3 * World.TILE;
        const y = p.y + p.h - 2 * World.TILE;
        World.platforms.length = 0;
        World.addPlatform({ x, y, w: 3 * World.TILE, h: 6, life: 6 });
        break;
      }
      case "bone_bridge": {
        // Bone bridge: the anchor, but 5 tiles long and it lasts longer.
        const x = p.facing > 0 ? p.x + p.w + 4 : p.x - 4 - 5 * World.TILE;
        const y = p.y + p.h - 2 * World.TILE;
        World.platforms.length = 0;
        World.addPlatform({ x, y, w: 5 * World.TILE, h: 6, life: 8, color: "#e8e2d0" });
        break;
      }
      case "ghost":
        // Ghost: enemy contact and arrows pass through for a short time.
        scene.ghostT = 1.5;
        break;
      case "float":
        scene.floatT = 1.2;
        break;
      case "blink":
        blink(p);
        break;
      case "leap":
        // Rat leap: a high jump from the ground, about 5 tiles.
        if (p.grounded) {
          p.vy = -540;
          p.jumping = false;
          Effects.dust(p.x + p.w / 2, p.y + p.h, "#8a7a66", 5, 2, 0.3);
        }
        break;
      case "scurry":
        scene.scurryT = 2.0;
        break;
      case "hop":
        if (!p.grounded && !p.hopUsed) {
          p.vy = -300;
          p.hopUsed = true;
        }
        break;
      default:
        break;
    }
  }

  // Teleport forward up to 96 px. Shorter steps are tried if the target is solid.
  function blink(p) {
    Effects.ring(p.x + p.w / 2, p.y + p.h / 2, "#b9a2f0");
    for (const dist of [96, 64, 32]) {
      const nx = p.x + p.facing * dist;
      const clear = World.overlapping(nx, p.y, p.w, p.h).every((c) => {
        const ch = c.ch;
        return !World.isSolid(ch);
      });
      if (clear) {
        p.x = Math.max(0, Math.min(nx, World.width - p.w));
        Effects.ring(p.x + p.w / 2, p.y + p.h / 2, "#b9a2f0");
        return;
      }
    }
  }

  function update(dt) {
    for (const hb of hitboxes) {
      hb.t -= dt;
      if (hb.kind === "bash") World.breakCracked(hb.x, hb.y, hb.w, hb.h);
      Enemies.list().forEach((e) => {
        if (e.dead || !overlaps(hb, e)) return;
        hitThisStep = true;
        Effects.spark(e.x + e.w / 2, e.y + e.h / 2, hb.dir);
        if (hb.stun) e.stunT = hb.stun;
        else Enemies.defeat(e, hb.x + hb.w / 2);
      });
    }
    for (let i = hitboxes.length - 1; i >= 0; i--) {
      if (hitboxes[i].t <= 0) hitboxes.splice(i, 1);
    }

    if (beam) updateBeam(dt);

    for (const q of projectiles) {
      q.life -= dt;
      q.x += q.vx * dt;
      if (World.overlapping(q.x, q.y, q.w, q.h).some((c) => World.isSolid(c.ch))) {
        // Hitting a wall: a few dust squares in the arrow's colour.
        Effects.dust(q.x, q.y, "#e8e4d8", 3, 2, 0.25);
        q.life = 0;
      }
      for (const e of Enemies.list()) {
        if (!e.dead && overlaps(q, e)) {
          hitThisStep = true;
          Effects.spark(q.x, q.y, q.vx > 0 ? 1 : -1);
          Enemies.defeat(e, q.x);
          q.life = 0;
        }
      }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) {
      if (projectiles[i].life <= 0) projectiles.splice(i, 1);
    }

    for (const h of hostile) {
      h.life -= dt;
      h.x += h.vx * dt;
      if (World.overlapping(h.x, h.y, h.w, h.h).some((c) => World.isSolid(c.ch))) h.life = 0;
    }
    for (let i = hostile.length - 1; i >= 0; i--) {
      if (hostile[i].life <= 0) hostile.splice(i, 1);
    }
  }

  // Staff tip, where the beam starts.
  function beamOrigin(b) {
    const p = b.body;
    return { x: b.dir > 0 ? p.x + p.w + 2 : p.x - 2, y: p.y + 12 };
  }

  // Beam: charge, then the head races out to range or the first wall.
  // Every enemy along it is hit once. Then it breaks up into motes.
  function updateBeam(dt) {
    const b = beam;
    b.t += dt;
    b.seed = (Math.random() * 1e9) | 0;
    const o = beamOrigin(b);
    if (b.t < BEAM.charge) {
      // Motes spiral in to the staff tip.
      const a = Math.random() * Math.PI * 2;
      b.motes.push({ x: o.x + Math.cos(a) * 14, y: o.y + Math.sin(a) * 14, tx: o.x, ty: o.y, t: 0 });
    } else if (b.t < BEAM.end) {
      if (b.len === 0) {
        Effects.flash(0.05);
        Effects.shake(0.12, 1);
      }
      if (!b.hitWall) {
        const step = 4;
        const target = Math.min(BEAM.range, b.len + BEAM.grow * dt);
        while (b.len < target) {
          const nx = o.x + b.dir * (b.len + step);
          if (World.overlapping(nx - 2, o.y - 2, 4, 4).some((c) => World.isSolid(c.ch))) {
            b.hitWall = true;
            break;
          }
          b.len += step;
        }
      }
      const rect = { x: b.dir > 0 ? o.x : o.x - b.len, y: o.y - BEAM.half - 1, w: b.len, h: BEAM.half * 2 + 2 };
      for (const e of Enemies.list()) {
        if (e.dead || b.hit.has(e) || !overlaps(rect, e)) continue;
        b.hit.add(e);
        hitThisStep = true;
        Effects.spark(e.x + e.w / 2, o.y, b.dir, "arcane");
        Enemies.defeat(e, o.x);
      }
      if (b.hitWall && Math.random() < 0.5) Effects.spray(o.x + b.dir * b.len, o.y, -b.dir, "arcane", 1);
    } else if (b.t < BEAM.end + BEAM.fade) {
      // Rising motes where the beam breaks.
      const d = Math.random() * b.len;
      b.motes.push({ x: o.x + b.dir * d, y: o.y, tx: o.x + b.dir * d, ty: o.y - 14, t: 0 });
    } else {
      beam = null;
      return;
    }
    for (const m of b.motes) {
      m.t += dt;
      m.x += (m.tx - m.x) * Math.min(1, dt * 12);
      m.y += (m.ty - m.y) * Math.min(1, dt * 12);
    }
    b.motes = b.motes.filter((m) => m.t < 0.25);
  }

  // Set to true to outline the hitboxes, for checking reach.
  const debug = { on: false };
  const DEG = Math.PI / 180;

  // Slash: a smear crescent sweeping from -70 to +50 degrees over the hitbox's life.
  // Only the last 60 degrees are drawn. Bands: faint halo, deep, pale, white core.
  function drawSlash(ctx, hb, cx, cy) {
    const prog = 1 - Math.max(0, hb.t) / hb.total;
    const a = 1 - prog;
    const end = -70 + 120 * prog;
    const start = end - 60;
    const x = hb.ox - cx;
    const y = hb.oy - cy;
    const c = Glow.RAMPS.steel;
    const arc = (r) => {
      ctx.beginPath();
      if (hb.dir > 0) ctx.arc(x, y, r, start * DEG, end * DEG);
      else ctx.arc(x, y, r, (180 - end) * DEG, (180 - start) * DEG);
    };
    ctx.globalAlpha = a * 0.3;
    arc(22); ctx.lineWidth = 8; ctx.strokeStyle = c[3]; ctx.stroke();
    ctx.globalAlpha = a;
    arc(22); ctx.lineWidth = 5; ctx.strokeStyle = c[3]; ctx.stroke();
    arc(22); ctx.lineWidth = 3; ctx.strokeStyle = c[1]; ctx.stroke();
    arc(23); ctx.lineWidth = 1; ctx.strokeStyle = c[0]; ctx.stroke();
    ctx.globalAlpha = 1;
    // Glint on the leading tip for the first half of the swing.
    if (prog < 0.5) {
      const ang = (hb.dir > 0 ? end : 180 - end) * DEG;
      Glow.star(ctx, x + Math.cos(ang) * 22, y + Math.sin(ang) * 22, 4, Math.floor(prog * 8), "steel", a);
    }
  }

  // Thrust: a banded streak along the reach, fading in from the body, with a tip glint.
  function drawThrust(ctx, hb, cx, cy) {
    const prog = 1 - Math.max(0, hb.t) / hb.total;
    const x = Math.round(hb.x - cx);
    const y = Math.round(hb.y - cy + hb.h / 2 - 1.5);
    const c = Glow.RAMPS.steel;
    const streak = (h, color, alpha) => {
      const grad = ctx.createLinearGradient(hb.dir > 0 ? x : x + hb.w, 0, hb.dir > 0 ? x + hb.w : x, 0);
      grad.addColorStop(0, "rgba(255, 255, 255, 0)");
      grad.addColorStop(1, color);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = grad;
      ctx.fillRect(x, y + 1 - Math.floor(h / 2), hb.w, h);
    };
    streak(5, c[3], 0.4 * (1 - prog));
    streak(3, c[2], 0.9);
    streak(1, c[0], 1);
    ctx.globalAlpha = 1;
    const tip = hb.dir > 0 ? x + hb.w : x;
    Glow.star(ctx, tip, y + 1, 4, Math.floor(prog * 8), "steel", 1 - prog);
  }

  // Shield bash: a banded half ring in front of the body, growing and fading.
  function drawBash(ctx, hb, cx, cy) {
    const prog = 1 - Math.max(0, hb.t) / hb.total;
    const x = hb.ox - cx + hb.dir * 6;
    const y = hb.oy - cy + 8;
    const r = 10 + 18 * prog;
    const c = Glow.RAMPS.steel;
    const half = (rr, w, color, alpha) => {
      ctx.beginPath();
      if (hb.dir > 0) ctx.arc(x, y, rr, -90 * DEG, 90 * DEG);
      else ctx.arc(x, y, rr, 90 * DEG, 270 * DEG);
      ctx.lineWidth = w;
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.stroke();
    };
    half(r, 6, c[3], 0.3 * (1 - prog));
    half(r, 3, c[2], 1 - prog);
    half(r, 1, c[0], 1 - prog);
    ctx.globalAlpha = 1;
    Glow.light(ctx, x, y, r + 6, c[3], 0.25 * (1 - prog));
  }

  // A 14 by 3 arrow pointing along its direction: shaft, head, and two fletching pixels.
  function drawArrow(ctx, x, y, dir, shaft, head, fletch) {
    const tail = dir > 0 ? x : x + 14;
    ctx.fillStyle = shaft;
    ctx.fillRect(dir > 0 ? x : x + 2, y + 1, 12, 1);
    ctx.fillStyle = head;
    ctx.beginPath();
    if (dir > 0) {
      ctx.moveTo(x + 14, y - 0.5); ctx.lineTo(x + 10, y + 1); ctx.lineTo(x + 14, y + 2.5);
    } else {
      ctx.moveTo(x, y - 0.5); ctx.lineTo(x + 4, y + 1); ctx.lineTo(x, y + 2.5);
    }
    ctx.fill();
    ctx.fillStyle = fletch;
    ctx.fillRect(tail - (dir > 0 ? 2 : -1), y, 1, 1);
    ctx.fillRect(tail - (dir > 0 ? 2 : -1), y + 2, 1, 1);
  }

  // Mage beam. Per column, separate upper and lower half widths with jitter, a
  // wobble, and a pulse that travels out from the staff. Each column is cut into
  // the arcane bands. Lightning, a flare at the staff, and an impact at a wall.
  function drawBeam(ctx, b, cx, cy) {
    const o = beamOrigin(b);
    const ox = Math.round(o.x - cx);
    const oy = Math.round(o.y - cy);
    const rand = Glow.rng(b.seed);
    const c = Glow.RAMPS.arcane;
    const frame = Math.floor(b.t * 60);
    for (const m of b.motes) {
      ctx.fillStyle = m.t < 0.12 ? c[1] : c[3];
      ctx.fillRect(Math.round(m.x - cx), Math.round(m.y - cy), 1, 1);
    }
    if (b.t < BEAM.charge) {
      Glow.disc(ctx, ox, oy, 2 + (b.t / BEAM.charge) * 3, "arcane");
      return;
    }
    const fading = b.t >= BEAM.end;
    const f = fading ? (b.t - BEAM.end) / BEAM.fade : 0;
    for (let d = 0; d <= b.len; d += 40) Glow.light(ctx, ox + b.dir * d, oy, 20, c[3], 0.16 * (1 - f));
    for (let d = 0; d < b.len; d++) {
      // Breaking up: random gaps mixed with a slow wave, more of them as it fades.
      if (fading && rand() * 0.7 + 0.3 * Math.sin(d * 0.08 + b.t * 9) < f * 1.2) continue;
      const taper = Math.min(1, (d + 2) / 10);
      const wobble = Math.sin(d * 0.21 + b.t * 30) * 0.6 + Math.sin(d * 0.07 - b.t * 17) * 0.5;
      const pulse = Math.pow(Math.max(0, Math.sin(d * 0.12 - b.t * 40)), 6) * 1.5;
      const base = (BEAM.half + pulse) * taper * (1 - f * 0.6);
      const up = bandsAt(base + wobble * 0.5 + (rand() - 0.5) * 1.2);
      const dn = bandsAt(base - wobble * 0.5 + (rand() - 0.5) * 1.2);
      const x = ox + b.dir * d;
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = c[4];
      ctx.fillRect(x, oy - Math.round(up[4] + 2), 1, Math.round(up[4] + dn[4] + 4));
      ctx.globalAlpha = 1;
      for (let i = 4; i >= 0; i--) {
        const u = Math.round(up[i]);
        const l = Math.round(dn[i]);
        if (u + l < 1) continue;
        ctx.fillStyle = c[i];
        ctx.fillRect(x, oy - u, 1, u + l);
      }
    }
    if (!fading) {
      // Fresh lightning every step, a few with a short branch.
      const n = 2 + Math.floor(rand() * 2);
      for (let k = 0; k < n; k++) {
        const a = rand() * b.len;
        const l = 18 + rand() * 30;
        const side = rand() < 0.5 ? -1 : 1;
        const x0 = ox + b.dir * a;
        const x1 = ox + b.dir * Math.min(b.len, a + l);
        const pts = Glow.bolt(ctx, x0, oy + side * (BEAM.half + 1), x1, oy + side * (BEAM.half + 2 + rand() * 3), "arcane", rand, 7);
        if (rand() < 0.5) {
          const [bx, by] = pts[Math.floor(pts.length / 2)];
          Glow.bolt(ctx, bx, by, bx + b.dir * 8, by + side * (4 + rand() * 4), "arcane", rand, 4, 2);
        }
      }
      // Flare at the staff tip.
      Glow.disc(ctx, ox, oy, 6 + (frame % 4 < 2 ? 1 : 0), "arcane");
      Glow.star(ctx, ox, oy, 8, frame, "arcane");
      if (b.hitWall) {
        // Impact: a pulsing disc and short jagged rays aimed back at the caster.
        const hx = ox + b.dir * b.len;
        Glow.disc(ctx, hx, oy, 5 + (frame % 3), "arcane");
        for (let k = 0; k < 5; k++) {
          const ang = (rand() - 0.5) * 2.2;
          const len = 6 + rand() * 8;
          Glow.bolt(ctx, hx, oy, hx - b.dir * Math.cos(ang) * len, oy + Math.sin(ang) * len, "arcane", rand, 3, 2);
        }
        Glow.light(ctx, hx, oy, 20, c[3], 0.25);
      }
    }
  }

  // Band half widths for one side of a beam column.
  function bandsAt(w) {
    return w <= 0 ? [0, 0, 0, 0, 0] : Glow.bandWidths(w).map((v) => Math.max(0, v - 1.5));
  }

  function draw(ctx, cx, cy) {
    for (const hb of hitboxes) {
      if (debug.on) {
        ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
        ctx.strokeRect(Math.round(hb.x - cx), Math.round(hb.y - cy), hb.w, hb.h);
      }
      if (hb.kind === "slash") drawSlash(ctx, hb, cx, cy);
      else if (hb.kind === "thrust") drawThrust(ctx, hb, cx, cy);
      else if (hb.kind === "bash") drawBash(ctx, hb, cx, cy);
    }
    if (beam) drawBeam(ctx, beam, cx, cy);
    for (const q of projectiles) {
      const dir = q.vx > 0 ? 1 : -1;
      if (q.owner === "weaver") Glow.disc(ctx, q.x - cx + (dir > 0 ? 0 : 14), q.y - cy + 1, 4, "bone", 0.6);
      drawArrow(ctx, Math.round(q.x - cx), Math.round(q.y - cy), dir, "#c8a46a", "#d8d8e0", "#e8e4d8");
    }
    for (const h of hostile) {
      drawArrow(ctx, Math.round(h.x - cx), Math.round(h.y - cy), h.vx > 0 ? 1 : -1, "#5a3a2a", "#d8d8e0", "#c2452d");
    }
  }

  function fireHostile(x, y, dir) {
    Effects.flare(x, y + 2, "ember");
    hostile.push({ x, y, w: 8, h: 4, vx: dir * 240, life: 2.5 });
  }

  // True if a hostile arrow hits the body. The arrow is used up on contact.
  function hitByHostile(body) {
    for (const h of hostile) {
      if (h.life > 0 && overlaps(h, body)) {
        h.life = 0;
        return true;
      }
    }
    return false;
  }

  // True once after an attack hit. Reading it clears it.
  function consumeHit() {
    const hit = hitThisStep;
    hitThisStep = false;
    return hit;
  }

  function reset() {
    hitboxes.length = 0;
    projectiles.length = 0;
    hostile.length = 0;
    beam = null;
  }

  return { use, update, draw, fireHostile, beamActive: () => !!beam, hitByHostile, hostileCount: () => hostile.length, reset, consumeHit, debug, COOLDOWN };
})();

// ---- anim.js ----
// Animation frames for the player and enemies. Frames come from the Liberated Pixel Cup
// sheets made by game/tools/build_lpc.py: 13 columns by 8 rows of 64 px cells.
// ANIM_ROWS gives [row, frame count] for each animation. The sheets hold right-facing
// frames; left is drawn by flipping.
const ANIM_ROWS = {
  idle: [0, 2],
  walk: [1, 9],
  slash: [2, 6],
  thrust: [3, 8],
  spellcast: [4, 7],
  shoot: [5, 13],
  hurt: [6, 6],
  jump: [7, 5],
};

// Seconds for one melee, cast, shoot, or jump action. Frames are spread evenly over it.
const ACTION_LENGTH = { slash: 0.2, thrust: 0.24, spellcast: 0.3, shoot: 0.3, jump: 0.25 };

// The animation each ability plays. Abilities not listed play no action.
const ACTION_FOR_ABILITY = {
  slash: "slash", thrust: "thrust", shield_bash: "slash", charge: "thrust",
  shoot: "shoot", arrow_anchor: "shoot", spell_bolt: "spellcast", bone_bridge: "spellcast",
  blink: "spellcast", float: "spellcast", ghost: "spellcast",
  leap: "jump", hop: "jump", scurry: "walk",
};

// Sheet key for each character (see CHARACTERS in abilities.js).
const LPC_KEY = {
  knight: "lpc_knight",
  ranger: "lpc_ranger",
  mage: "lpc_mage",
  rat: "lpc_rat",
  weaver: "lpc_weaver",
};

// Starts an action on a body when its ability fires. Scurry is a walk, so it has no action.
function startAction(body, abilityId) {
  const action = ACTION_FOR_ABILITY[abilityId];
  if (!action || action === "walk") return;
  body.action = action;
  body.animT = 0;
}

// Picks the frame for a body this step. Pure: reads state, changes nothing.
function pickFrame(body, time) {
  if (body.action) {
    const [row, count] = ANIM_ROWS[body.action];
    const col = Math.min(count - 1, Math.floor(body.animT / (ACTION_LENGTH[body.action] / count)));
    return { row, col };
  }
  if (!body.grounded) return { row: ANIM_ROWS.jump[0], col: body.vy < 0 ? 0 : 1 };
  if (body.landT > 0) return { row: ANIM_ROWS.idle[0], col: 0 };
  if (Math.abs(body.vx) > 1) return { row: ANIM_ROWS.walk[0], col: Math.floor(body.walkDist / 6) % ANIM_ROWS.walk[1] };
  return { row: ANIM_ROWS.idle[0], col: Math.floor(time * 2) % ANIM_ROWS.idle[1] };
}

// Offscreen canvas for the ghost outline's cyan copy. Made once at load.
const GhostCanvas = (() => {
  const c = document.createElement("canvas");
  c.width = 64;
  c.height = 64;
  return c;
})();

// Draws one 64 by 64 cell from a sheet with its bottom centre at (x, y). Flipped when facing left.
function drawFrame(ctx, sheet, frame, x, y, facing) {
  const sx = frame.col * 64;
  const sy = frame.row * 64;
  if (facing < 0) {
    ctx.save();
    ctx.translate(x + 64, y);
    ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, 64, 64, 0, 0, 64, 64);
    ctx.restore();
  } else {
    ctx.drawImage(sheet, sx, sy, 64, 64, x, y, 64, 64);
  }
}

// Scenes: the input test screen and the play slice.

// Shows every logical action and lights it while it is held.
class InputTestScene {
  constructor() {
    this.labels = [
      ["left", "Left"],
      ["right", "Right"],
      ["up", "Jump"],
      ["down", "Down"],
      ["ab1", "A / X"],
      ["ab2", "S / Y"],
      ["ab3", "Z / A"],
      ["ab4", "X / B"],
      ["discardSelf", "Q"],
      ["discardCard", "C"],
      ["start", "Enter / Start"],
    ];
    this.flash = {};
  }

  update(dt) {
    for (const [action] of this.labels) {
      if (Input.pressed(action)) this.flash[action] = 0.3;
      else if (this.flash[action] > 0) this.flash[action] -= dt;
    }
    if (menuBack()) Engine.setScene(new TitleScene());
  }

  draw(ctx) {
    ctx.fillStyle = "#1b2430";
    ctx.fillRect(0, 0, Engine.W, Engine.H);

    ctx.fillStyle = "#e8e4d8";
    ctx.font = "16px GameFont, system-ui, sans-serif";
    drawText(ctx, "Input check", 16, 28);
    ctx.font = "11px GameFont, system-ui, sans-serif";
    ctx.fillStyle = "#9fb0c0";
    drawText(ctx, "Press each key or button. X or B returns to the title.", 16, 46);

    this.labels.forEach(([action, label], i) => {
      const col = i % 4;
      const row = Math.floor(i / 4);
      const x = 16 + col * 112;
      const y = 66 + row * 42;
      const held = Input.down(action);
      const flashing = (this.flash[action] || 0) > 0;
      ctx.fillStyle = held ? "#d9a441" : flashing ? "#6d8ea8" : "#2a3644";
      ctx.fillRect(x, y, 100, 32);
      ctx.fillStyle = held ? "#111418" : "#e8e4d8";
      ctx.font = "11px GameFont, system-ui, sans-serif";
      drawText(ctx, label, x + 8, y + 20);
    });
  }
}

// Shared menu helpers. Up and Down move the choice, Z or A or Enter confirms,
// X or B or Q backs out.
function menuStep(sel, count) {
  let next = sel;
  if (Input.pressed("up")) next = (sel + count - 1) % count;
  if (Input.pressed("down")) next = (sel + 1) % count;
  return next;
}

function menuConfirm() {
  return Input.pressed("ab3") || Input.pressed("start");
}

function menuBack() {
  return Input.pressed("ab4") || Input.pressed("discardSelf");
}

function drawMenu(ctx, title, items, sel, footer) {
  ctx.fillStyle = "#1b2430";
  ctx.fillRect(0, 0, Engine.W, Engine.H);
  ctx.fillStyle = "#e8e4d8";
  ctx.textAlign = "center";
  ctx.font = "22px GameFont, system-ui, sans-serif";
  drawText(ctx, title, Engine.W / 2, 74);
  ctx.font = "14px GameFont, system-ui, sans-serif";
  items.forEach((label, i) => {
    const y = 120 + i * 30;
    ctx.fillStyle = i === sel ? "#d9a441" : "#e8e4d8";
    drawText(ctx, (i === sel ? "> " : "  ") + label, Engine.W / 2, y);
  });
  ctx.font = "11px GameFont, system-ui, sans-serif";
  ctx.fillStyle = "#9fb0c0";
  drawText(ctx, footer, Engine.W / 2, Engine.H - 16);
  ctx.textAlign = "left";
}

// Title screen: level 1 sky and hills, the five characters walking along the bottom, and the menu.
function drawTitle(ctx, scene) {
  const theme = World.THEMES.field;
  ctx.fillStyle = theme.sky;
  ctx.fillRect(0, 0, Engine.W, Engine.H);
  const drift = scene.t * 12;
  drawHills(ctx, drift * 0.25, theme.far, 150, 0.012, 14);
  drawHills(ctx, drift * 0.5, theme.near, 190, 0.02, 20);

  // Walkers, left to right, looping. Each uses its own walk frames.
  const cast = ["knight", "ranger", "mage", "rat", "weaver"];
  cast.forEach((id, i) => {
    const span = Engine.W + 120;
    const x = ((scene.t * 40 + i * 96) % span) - 60;
    const col = Math.floor(scene.t * 8 + i) % 6;
    drawFrame(ctx, IMG[LPC_KEY[id]] || IMG["lpc_" + id], { row: 1, col }, Math.round(x - 32), Engine.H - 96, 1);
  });

  ctx.textAlign = "center";
  ctx.font = "bold 28px GameFont, system-ui, sans-serif";
  ctx.fillStyle = "#f4efe2";
  drawText(ctx, "Changeling", Engine.W / 2, 56);
  ctx.font = "12px GameFont, system-ui, sans-serif";
  ctx.fillStyle = "#e8e4d8";
  drawText(ctx, "Knight of a thousand faces", Engine.W / 2, 74);
  ctx.font = "14px GameFont, system-ui, sans-serif";
  scene.items.forEach((label, i) => {
    const y = 104 + i * 22;
    ctx.fillStyle = i === scene.sel ? "#d9a441" : "#f4efe2";
    drawText(ctx, (i === scene.sel ? "> " : "") + label, Engine.W / 2, y);
  });
  ctx.font = "10px GameFont, system-ui, sans-serif";
  ctx.fillStyle = "#e8e4d8";
  drawText(ctx, "Arrows move   Up jump   A S Z X powers   Enter pause", Engine.W / 2, Engine.H - 8);
  ctx.textAlign = "left";
}

// Title screen: start, input check, credits.
// Save for Continue: the level, character, hand, and run stats, in localStorage.
// Every call is guarded, since storage can be blocked.
const SaveGame = {
  key: "changeling_save",
  save(data) {
    try {
      localStorage.setItem(this.key, JSON.stringify(data));
    } catch (e) {
      /* storage unavailable: no save */
    }
  },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },
  clear() {
    try {
      localStorage.removeItem(this.key);
    } catch (e) {
      /* storage unavailable */
    }
  },
};

// Stats for the whole run, shown at the end.
const Run = { deaths: 0, secrets: 0, startTime: 0 };

function newRun() {
  Run.deaths = 0;
  Run.secrets = 0;
  Run.startTime = performance.now();
}

// Clears every system a new game touches. Continue does not call it.
function resetGame() {
  Hand.reset();
  newRun();
  Attacks.reset();
  Effects.reset();
  World.load(0);
  Input.clearAll();
}

class TitleScene {
  constructor() {
    const saved = SaveGame.load();
    this.items = saved ? ["Continue", "New game", "Input check", "Credits"] : ["Play", "Input check", "Credits"];
    this.sel = 0;
    this.saved = saved;
    // Clock for the walking characters and the sky drift.
    this.t = 0;
  }

  update(dt) {
    this.t += dt;
    this.sel = menuStep(this.sel, this.items.length);
    if (!menuConfirm()) return;
    const choice = this.items[this.sel];
    if (choice === "Continue") {
      Hand.restore(this.saved.cards);
      Object.assign(Run, this.saved.run);
      Engine.setScene(new PlayScene(this.saved.level, this.saved.active));
    } else if (choice === "Play" || choice === "New game") {
      SaveGame.clear();
      resetGame();
      Engine.setScene(new IntroScene());
    } else if (choice === "Input check") {
      Engine.setScene(new InputTestScene());
    } else if (choice === "Credits") {
      Engine.setScene(new CreditsScene());
    }
  }

  draw(ctx) {
    drawTitle(ctx, this);
  }
}

// Credits: sources and licenses for the art and code.
// Ending screen. Shown after the last level. Text is filled in by task F2.
class EndingScene {
  constructor() {
    this.total = 0;
    for (let i = 0; i < World.count; i++) this.total += World.countSecrets(i);
    const secs = Math.floor((performance.now() - Run.startTime) / 1000);
    const mm = String(Math.floor(secs / 60)).padStart(2, "0");

    this.stats = "Deaths: " + Run.deaths + "    Secrets: " + Run.secrets + " of " + this.total + "    Time: " + mm + ":" + ss;
    SaveGame.clear();
  }

  update() {
    if (menuConfirm()) Engine.setScene(new CreditsScene());
  }

  draw(ctx) {
    ctx.fillStyle = "#1b2430";
    ctx.fillRect(0, 0, Engine.W, Engine.H);
    ctx.fillStyle = "#e8e4d8";
    ctx.textAlign = "center";
    ctx.font = "14px GameFont, system-ui, sans-serif";
    drawText(ctx, "The Warlord falls. The faces return to their owners.", Engine.W / 2, 80);
    ctx.font = "12px GameFont, system-ui, sans-serif";
    drawText(ctx, this.stats, Engine.W / 2, 116);
    ctx.font = "12px GameFont, system-ui, sans-serif";

  }
}
